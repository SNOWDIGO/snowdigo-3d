<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b3b52"/>
      <stop offset="1" stop-color="#0d111a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <g id="sword">
      <rect x="45" y="12" width="10" height="52" rx="4" fill="#38e8ff" filter="url(#glow)" opacity=".75"/>
      <polygon points="50,9 55.5,20 55.5,62 44.5,62 44.5,20" fill="#e8fbff"/>
      <rect x="37" y="62" width="26" height="6" rx="3" fill="#f2b84b"/>
      <rect x="47" y="68" width="6" height="15" rx="2" fill="#7a4a22"/>
      <circle cx="50" cy="86" r="4" fill="#f2b84b"/>
    </g>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>
  <use href="#sword" transform="rotate(45 50 50)"/>
  <use href="#sword" transform="rotate(-45 50 50)"/>
</svg>
