<style>
:root{--bg:#120d18;--fg:#fff2e0;--ac:#ff8c1a;--bt:rgba(255,242,224,.2)}

canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;font-size:15px;pointer-events:none;text-shadow:0 1px 3px #000}
#h2{text-align:right;padding-right:52px}
#hp{font-size:22px;color:#ff4a6a;letter-spacing:3px;text-shadow:0 2px 4px #000}
#bn{position:fixed;top:18%;left:0;right:0;text-align:center;font-size:20px;white-space:pre-line;opacity:0;transition:opacity .6s;pointer-events:none;text-shadow:0 2px 6px #000}
.b{position:fixed;width:68px;height:62px;border-radius:20px;background:rgba(255,255,255,.16);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);border:2px solid rgba(255,255,255,.4);color:#fff;font:15px Georgia,serif;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;box-shadow:0 3px 10px rgba(0,0,0,.35)}

.b:active{background:rgba(255,255,255,.34)}
#L{left:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#R{left:92px;bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#J{right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#A{right:92px;bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#M{right:14px;bottom:calc(96px + env(safe-area-inset-bottom,0px));background:rgba(255,140,26,.35)}
#ov{position:fixed;inset:0;z-index:60;background:rgba(18,13,24,.86);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px}
#ov h1{font-size:44px;margin:0;letter-spacing:.02em;color:var(--ac)}
#tx{max-width:460px;line-height:1.5;white-space:pre-line;margin:0}
#ov button{font:18px Georgia,serif;padding:12px 26px;border-radius:8px;border:2px solid var(--ac);background:transparent;color:var(--fg)}
#ov button:first-of-type{background:var(--ac);color:#1a1006}
#rot{display:none;position:fixed;inset:0;z-index:99;background:#120d18;color:#fff2e0;align-items:center;justify-content:center;text-align:center;font-size:24px;padding:24px}
@media (orientation:portrait){#rot{display:flex}}
/* Title screen */
#ts{position:fixed;inset:0;z-index:50;display:none;overflow:hidden;background:linear-gradient(#1b0b3a 0%,#4b1d7a 32%,#c2459a 62%,#ff9a6b 84%,#ffd08a 100%)}
#ts svg{position:absolute;inset:0;width:100%;height:100%}
.st{position:absolute;border-radius:50%;background:#fff6c8;box-shadow:0 0 6px #ffe9a0;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.fl{animation:bob 4s ease-in-out infinite}.fl2{animation:bob 5s ease-in-out infinite reverse}
.sw{transform-box:fill-box;transform-origin:100% 50%;animation:sway 1.4s ease-in-out infinite}
.glow{animation:pulse 1.4s ease-in-out infinite}
.cl{animation:drift 9s ease-in-out infinite alternate}
#logo{position:absolute;left:0;right:0;top:3vh;text-align:center;pointer-events:none;animation:bob 3.5s ease-in-out infinite}

#m1{height:clamp(44px,13vh,66px)!important;background:linear-gradient(#7dff8a,#1fb85a);animation:beat 1.3s ease-in-out infinite}
#m2{background:linear-gradient(#ffb3d9,#ff4f9a)}#m3{background:linear-gradient(#8fdcff,#2f8fff)}#m4{background:linear-gradient(#d9b3ff,#8a4fff)}
#m1::before{content:"\25B6  "}#m2::before{content:"\2726  "}#m3::before{content:"\2725  "}#m4::before{content:"\2605  "}
.mp{display:block;width:100%;margin:6px 0}.mp:disabled{opacity:.4}
#tv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 75%}
#shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.65),rgba(0,0,0,0) 45%),linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0) 35%)}
#menu{left:50%;right:auto;top:auto;bottom:calc(6vh + env(safe-area-inset-bottom,0px));transform:translateX(-50%);flex-direction:row;width:auto;gap:4vw}
