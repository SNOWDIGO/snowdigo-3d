<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snowdigo 2D — Anime Action Fantasy</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d111a">
<style>
:root{
  --bg:#0d111a;
  --fg:#fff6e8;
  --ac:#38e8ff;
  --bt:rgba(13,17,26,.68);
}
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;background:var(--bg);overflow:hidden;
  touch-action:none;font-family:Georgia,"Times New Roman",serif;color:var(--fg);
  user-select:none;-webkit-user-select:none;
}
canvas{display:block;width:100%;height:100%}
#flash{
  position:fixed;inset:0;z-index:25;pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgba(106,240,255,.75) 0%,rgba(56,232,255,.25) 55%,rgba(255,255,255,0) 100%);
  transition:opacity .08s ease-out;
}
#hud{
  position:fixed;top:0;left:0;right:0;z-index:10;
  padding:calc(8px + env(safe-area-inset-top,0px)) 14px 0;
  display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:13px;pointer-events:none;text-shadow:0 2px 6px rgba(0,0,0,.92);
}
#hud span{
  background:rgba(12,16,26,.72);padding:5px 11px;border-radius:10px;
  border:1px solid rgba(106,240,255,.28);backdrop-filter:blur(4px);
}
#bn{
  position:fixed;top:15%;left:0;right:0;z-index:12;text-align:center;
  font-size:18px;white-space:pre-line;opacity:0;transition:opacity .45s;
  pointer-events:none;text-shadow:0 3px 10px rgba(0,0,0,.96);
}
.b{
  position:fixed;z-index:15;width:62px;height:62px;border-radius:18px;
  background:var(--bt);border:2px solid rgba(106,240,255,.45);color:var(--fg);
  font:700 13px Georgia,serif;display:flex;align-items:center;justify-content:center;
  touch-action:none;box-shadow:0 6px 16px rgba(0,0,0,.55);
}
.b:active{transform:scale(.93);background:rgba(106,240,255,.28)}
#L{left:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#R{left:88px;bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#J{right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#A{right:88px;bottom:calc(18px + env(safe-area-inset-bottom,0px));border-color:#38e8ff}
#M{right:14px;bottom:calc(92px + env(safe-area-inset-bottom,0px));background:rgba(255,140,26,.45)}
#SH{right:88px;bottom:calc(92px + env(safe-area-inset-bottom,0px));background:rgba(56,232,255,.32);font-size:12px}
#EN{right:162px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:rgba(255,196,64,.36);font-size:12px}
#SPBTN{
  position:fixed;right:58px;top:calc(42px + env(safe-area-inset-top,0px));z-index:16;
  height:36px;padding:0 12px;border-radius:18px;background:rgba(16,22,34,.82);
  border:1.5px solid #38e8ff;color:#aef7ff;font:700 11px Georgia,serif;cursor:pointer;
}
#ov{
  position:fixed;inset:0;z-index:60;background:rgba(10,14,22,.93);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;gap:14px;
}
#ov h1{font-size:36px;margin:0;letter-spacing:.02em;color:var(--ac)}
#tx{max-width:520px;width:100%;line-height:1.5;white-space:pre-line;margin:0}
#ov button{
  font:17px Georgia,serif;padding:11px 24px;border-radius:8px;
  border:2px solid var(--ac);background:transparent;color:var(--fg);cursor:pointer;
}
#ov button:first-of-type{background:var(--ac);color:#08131a;font-weight:700}
#rot{
  display:none;position:fixed;inset:0;z-index:99;background:#0d111a;color:#fff2e0;
  align-items:center;justify-content:center;text-align:center;font-size:24px;padding:24px;
}
@media (orientation:portrait){#rot{display:flex}}
/* Title screen */
#ts{
  position:fixed;inset:0;z-index:50;display:none;overflow:hidden;
  background:radial-gradient(circle at 32% 45%,#1d586e 0%,#132638 48%,#0b0f19 100%);
}
#logo{
  position:absolute;left:5vw;top:12vh;pointer-events:none;
}
#logo b{
  display:inline-block;font:900 min(14vh,8.5vw) "Trebuchet MS",Verdana,sans-serif;
  color:#aef7ff;letter-spacing:.02em;
  text-shadow:0 0 22px rgba(56,232,255,.75),0 4px 0 #0a2233;
}
#logo u{
  display:inline-block;text-decoration:none;font-size:.38em;color:#08131a;background:#38e8ff;
  border:2px solid #fff;border-radius:.4em;padding:.08em .38em;margin-left:.3em;
  vertical-align:top;transform:rotate(-6deg);
}
#logo small{
  display:block;margin-top:1vh;font:italic 700 clamp(12px,3vh,19px) Georgia,serif;
  color:#ffe3b8;letter-spacing:.08em;text-shadow:0 2px 6px rgba(0,0,0,.85);
}
#menu{
  position:absolute;right:5vw;top:24%;width:min(34vw,290px);
  display:flex;flex-direction:column;gap:2vh;
}
#menu button{
  height:clamp(38px,10.5vh,56px);border:2px solid #aef7ff;border-radius:999px;color:#fff;
  font:800 clamp(15px,3.6vh,22px) "Trebuchet MS",Verdana,sans-serif;
  background:linear-gradient(180deg,#1b3b52,#0f2030);
  box-shadow:0 5px 0 rgba(0,0,0,.45),0 0 18px rgba(56,232,255,.22);cursor:pointer;
}
#menu button:active{transform:translateY(3px)}
#m1{height:clamp(46px,13vh,66px)!important;background:linear-gradient(180deg,#38e8ff,#1282a8)!important;color:#06131a!important}
.mp{
  display:block;width:100%;margin:6px 0;padding:10px 14px;border-radius:8px;
  border:1px solid rgba(106,240,255,.35);background:rgba(56,232,255,.16);
  color:#fff2e0;font:700 16px Georgia,serif;cursor:pointer;
}
.mp:disabled{opacity:.4;cursor:not-allowed}
</style>
</head>
<body>
<div id="rot">Please rotate your phone to landscape ↻</div>
<div id="flash"></div>
<canvas id="cv"></canvas>
<div id="hud"><span id="h1"></span><span id="h2"></span></div>
<div id="bn"></div>

<input type="file" id="spFile" accept="image/*" style="display:none">
<button id="SPBTN" title="Optional: Load your 4-pose sprite sheet image">Load Sprite</button>

<div class="b" id="L">◀</div>
<div class="b" id="R">▶</div>
<div class="b" id="EN">Enter</div>
<div class="b" id="SH">Shop</div>
<div class="b" id="M">Bolt</div>
<div class="b" id="A">Sword</div>
<div class="b" id="J">Jump</div>

<div id="ts">
 <div id="logo"><b>Snowdigo<u>2D</u></b><small>Seek the Mageblade. Master the Lightning.</small></div>
 <div id="menu">
  <button id="m1">▶ Start</button>
  <button id="m2">✦ Realms</button>
  <button id="m3">✥ Controls</button>
  <button id="m4">★ Story</button>
 </div>
</div>

<div id="ov">
 <h1 id="h">Snowdigo 2D</h1>
 <div id="tx"></div>
 <button id="b1"></button>
 <button id="b2"></button>
</div>

addEventListener('keydown',e=>{
 K[e.code]=1;
 if(e.repeat)return;
 if(['Space','ArrowUp','KeyW'].includes(e.code))T.jp=1;
 if(['KeyJ','KeyZ'].includes(e.code))T.ap=1;

});

// Optional custom 2x2 Sprite Sheet loader (removes dark background cleanly)
let spriteSheet=null;
$('SPBTN').onclick=()=>$('spFile').click();
$('spFile').onchange=e=>{
 const file=e.target.files[0];if(!file)return;
 const img=new Image();
 img.onload=()=>{
  const off=document.createElement('canvas');off.width=img.width;off.height=img.height;
  const oc=off.getContext('2d');oc.drawImage(img,0,0);
  const idata=oc.getImageData(0,0,off.width,off.height),d=idata.data;
  const bgR=d[0],bgG=d[1],bgB=d[2];
  for(let i=0;i<d.length;i+=4){
   const dist=Math.hypot(d[i]-bgR,d[i+1]-bgG,d[i+2]-bgB);
   if(dist<36)d[i+3]=0;
   else if(dist<55)d[i+3]=Math.floor(((dist-36)/19)*255);
  }
  oc.putImageData(idata,0,0);
  spriteSheet=off;
  banner('Custom 2D Anime Sprite Sheet Loaded!');
 };
 img.src=URL.createObjectURL(file);
};

let AC,mute=0;
function sfx(f,d=.1,ty='square',v=.045,f2){
 if(mute)return;
 try{
  AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  if(AC.state=='suspended')AC.resume();
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=ty;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);
 }catch(e){}
}
function triggerFlash(strength=.55){
 shk=Math.max(shk,.22);
 flEl.style.opacity=strength;
 clearTimeout(triggerFlash.t);
 triggerFlash.t=setTimeout(()=>flEl.style.opacity=0,95);
}

 cv.width=W*DPR;cv.height=H*DPR;
 ctx.setTransform(DPR,0,0,DPR,0,0);
}

 for(const f of fx.slice()){

function draw(){
 const q=Z[Z0],sp=Math.min(1,Math.abs(p.vx)/p.spd),air=!p.g,ph=tt*(12+sp*6);
 shk=Math.max(0,shk-0.016);
 const kx=(Math.random()-.5)*shk*28,ky=(Math.random()-.5)*shk*28;

 const targetX=inside?p.x*.25:p.x+p.f*1.8;
 const targetY=inside?1.6:Math.max(p.y,0)*.55+2.1;
 cx+=(targetX-cx)*.12;
 cy+=(targetY-cy)*.1;

 const ppm=Math.min(W,H)*0.115; // pixels per world meter
 const toSX=wx=>W*0.5+(wx-cx)*ppm+kx;
 const toSY=wy=>H*0.76-(wy-cy+1.6)*ppm+ky;

 // Sky Gradient
 const sg=ctx.createLinearGradient(0,0,0,H);
 if(inside){
  sg.addColorStop(0,'#120e1a');sg.addColorStop(1,'#241b2e');
 }else{
  sg.addColorStop(0,q.sky[0]);sg.addColorStop(.55,q.sky[1]);sg.addColorStop(1,q.sky[2]);
 }
 ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);

 if(inside){
  // Cottage Interior Room
  const rx0=toSX(-8),rx1=toSX(8),ryTop=toSY(5.5),ryFloor=toSY(0);
  ctx.fillStyle='#1d1526';ctx.fillRect(rx0,ryTop,rx1-rx0,ryFloor-ryTop);
  ctx.strokeStyle='#433252';ctx.lineWidth=4;ctx.strokeRect(rx0,ryTop,rx1-rx0,ryFloor-ryTop);

  // Wall torches
  [-3.8,3.8].forEach(tx=>{
   const sx=toSX(tx),sy=toSY(2.8);
   ctx.fillStyle='#5c3a21';ctx.fillRect(sx-4,sy,8,28);

   g.addColorStop(0,'rgba(255,210,90,0.85)');g.addColorStop(1,'rgba(255,120,20,0)');
   ctx.fillStyle=g;ctx.beginPath();ctx.arc(sx,sy-4,48,0,Math.PI*2);ctx.fill();
  });

  // Exit Door on left
  const dx=toSX(-5.5),dy=toSY(0);

  ctx.fillRect(dx-24,dy-74,48,74);ctx.strokeRect(dx-24,dy-74,48,74);

  if(roomChest){

   ctx.fillRect(chx-24,chy-32,48,32);ctx.strokeRect(chx-24,chy-32,48,32);
   ctx.fillStyle=roomChest.unlocked?'#ffd23a':'#ff3b5c';
   ctx.beginPath();ctx.arc(chx,chy-18,6,0,Math.PI*2);ctx.fill();
  }

  // Floor
  ctx.fillStyle='#4a3322';ctx.fillRect(rx0,ryFloor,rx1-rx0,H-ryFloor);
  ctx.fillStyle='#78553a';ctx.fillRect(rx0,ryFloor,rx1-rx0,8);

  // Room Guard Enemy
  if(roomEnemy&&roomEnemy.alive){
   const ex=toSX(roomEnemy.x),ey=toSY(roomEnemy.y);
   ctx.fillStyle=roomEnemy.fl>0?'#ffffff':'#9e2b4c';ctx.strokeStyle='#14080e';ctx.lineWidth=2.5;
   ctx.beginPath();ctx.arc(ex,ey,24,0,Math.PI*2);ctx.fill();ctx.stroke();
   ctx.fillStyle='#ffd23a';ctx.fillRect(ex-10,ey-6,6,6);ctx.fillRect(ex+4,ey-6,6,6);
  }
 }else{
  // High-quality illustrated 2D realm background (from the supplied 8-scene sheet)
  const bg = BG_IMAGES[BG_FOR_REALM[Z0] ?? 0];
  if(bg && bg.complete && bg.naturalWidth){
   const targetH = H * 0.84;
   const scale = Math.max(W / bg.naturalWidth, targetH / bg.naturalHeight);
   const dw = bg.naturalWidth * scale, dh = bg.naturalHeight * scale;
   const dx = (W - dw) * 0.5;
   ctx.save();
   ctx.globalAlpha = 0.98;
   ctx.drawImage(bg, dx, 0, dw, dh);
   const shade = ctx.createLinearGradient(0, 0, 0, H);
   shade.addColorStop(0, 'rgba(5,10,22,.06)');
   shade.addColorStop(.62, 'rgba(5,10,22,.02)');
   shade.addColorStop(1, 'rgba(5,10,22,.48)');
   ctx.fillStyle = shade;
   ctx.fillRect(0, 0, W, H);
   ctx.restore();
  }else{
   // Fallback while embedded artwork is loading.
   const sg=ctx.createLinearGradient(0,0,0,H);
   sg.addColorStop(0,q.sky[0]);sg.addColorStop(.55,q.sky[1]);sg.addColorStop(1,q.sky[2]);
   ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);
   [0.12,0.26].forEach((par,idx)=>{

     ctx.lineTo(sx,peak);

   });

  // Ambient floating embers/sparks (matches character backdrop!)

   ctx.beginPath();ctx.ellipse(sx,sy,a.sz*2.2,a.sz*.7,-.2,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // Village Cottages
  doors.forEach(d=>{

  if(shopSpot){

   ctx.fillStyle='#1f5c8a';ctx.beginPath();ctx.moveTo(dx-74,dy-82);ctx.lineTo(dx,dy-130);ctx.lineTo(dx+74,dy-82);ctx.closePath();ctx.fill();ctx.stroke();
   ctx.fillStyle='#ffd23a';ctx.font='bold 12px Georgia';ctx.textAlign='center';ctx.fillText('SHOP',dx,dy-62);
  }

  // Realm scenery is painted into the high-resolution background artwork.

  // Platforms & Rocky/Grassy Ledges
  for(const f of pl){
   const x0=toSX(f.a),x1=toSX(f.b),y0=toSY(f.y);
   if(x1<-40||x0>W+40)continue;
   const h=f.y<=0?H-y0:26;
   ctx.fillStyle=q.c;ctx.fillRect(x0,y0,x1-x0,h);

  }

  // Hazards
  for(const h of hz){
   const sx=toSX(h.x),sy=toSY(0);
   ctx.fillStyle='#ff4f79';ctx.beginPath();
   ctx.moveTo(sx-14,sy);ctx.lineTo(sx-7,sy-24);ctx.lineTo(sx,sy);
   ctx.lineTo(sx+7,sy-26);ctx.lineTo(sx+14,sy);ctx.closePath();ctx.fill();
  }

  // Chests
  for(const c of ch){
   const sx=toSX(c.x),sy=toSY(c.y);
   ctx.fillStyle=c.open?'#9e6834':'#784119';ctx.strokeStyle='#1f1005';ctx.lineWidth=2;
   ctx.fillRect(sx-20,sy-26,40,26);ctx.strokeRect(sx-20,sy-26,40,26);
   ctx.fillStyle='#ffd23a';ctx.fillRect(sx-4,sy-16,8,8);
  }

  // Mageblade Shards
  for(const s of sh){
   const sx=toSX(s.x),sy=toSY(s.y+Math.sin(tt*3+s.x)*.14);
   ctx.save();ctx.translate(sx,sy);ctx.shadowColor=q.sc;ctx.shadowBlur=16;
   ctx.fillStyle=q.sc;ctx.beginPath();
   ctx.moveTo(0,-18);ctx.lineTo(12,0);ctx.lineTo(0,18);ctx.lineTo(-12,0);ctx.closePath();ctx.fill();
   ctx.restore();

  for(const h of hr){

   if(e.t=='b'){
    ctx.fillStyle=e.fl>0?'#ffffff':q.boss.c;ctx.strokeStyle='#0d0f14';ctx.lineWidth=3;
