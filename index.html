<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snowdigo 2D — 8 Realms Anime Action Fantasy</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d111a">
<style>
:root{
  --bg:#0d111a;
  --fg:#fff6e8;
  --ac:#38e8ff;
  --bt:rgba(13,17,26,.68);
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;background:var(--bg);overflow:hidden;
  touch-action:none;font-family:Georgia,"Times New Roman",serif;color:var(--fg);
  user-select:none;-webkit-user-select:none;
}
canvas{display:block;width:100%;height:100%;image-rendering:auto}
#flash{
  position:fixed;inset:0;z-index:25;pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgba(106,240,255,.75) 0%,rgba(56,232,255,.25) 55%,rgba(255,255,255,0) 100%);
  transition:opacity .08s ease-out;
}
#hud{
  position:fixed;top:0;left:0;right:0;z-index:10;
  padding:calc(8px + env(safe-area-inset-top,0px)) 14px 0;
  display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:13px;pointer-events:none;text-shadow:0 2px 6px rgba(0,0,0,.92);
}
#hud span{
  background:rgba(12,16,26,.72);padding:5px 11px;border-radius:10px;
  border:1px solid rgba(106,240,255,.28);backdrop-filter:blur(4px);
}
#bn{
  position:fixed;top:15%;left:0;right:0;z-index:12;text-align:center;
  font-size:18px;white-space:pre-line;opacity:0;transition:opacity .45s;
  pointer-events:none;text-shadow:0 3px 10px rgba(0,0,0,.96);
}
.b{
  position:fixed;z-index:15;width:62px;height:62px;border-radius:18px;
  background:var(--bt);border:2px solid rgba(106,240,255,.45);color:var(--fg);
  font:700 13px Georgia,serif;display:flex;align-items:center;justify-content:center;
  touch-action:none;box-shadow:0 6px 16px rgba(0,0,0,.55);
}
.b:active{transform:scale(.93);background:rgba(106,240,255,.28)}
#L{left:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#R{left:88px;bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#J{right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#A{right:88px;bottom:calc(18px + env(safe-area-inset-bottom,0px));border-color:#38e8ff}
#M{right:14px;bottom:calc(92px + env(safe-area-inset-bottom,0px));background:rgba(255,140,26,.45)}
#SH{right:88px;bottom:calc(92px + env(safe-area-inset-bottom,0px));background:rgba(56,232,255,.32);font-size:12px}
#EN{right:162px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:rgba(255,196,64,.36);font-size:12px}
#SPBTN{
  position:fixed;right:58px;top:calc(42px + env(safe-area-inset-top,0px));z-index:16;
  height:36px;padding:0 12px;border-radius:18px;background:rgba(16,22,34,.82);
  border:1.5px solid #38e8ff;color:#aef7ff;font:700 11px Georgia,serif;cursor:pointer;
}
#MAPBTN{
  position:fixed;right:142px;top:calc(42px + env(safe-area-inset-top,0px));z-index:16;
  height:36px;padding:0 12px;border-radius:18px;background:rgba(28,18,46,.86);
  border:1.5px solid #f2b84b;color:#ffe49e;font:700 11px Georgia,serif;cursor:pointer;
}
body.editing-controls .b{
  z-index:75!important;
  outline:2px dashed #ffd23a;
  box-shadow:0 0 18px rgba(255,210,58,.65),0 6px 16px rgba(0,0,0,.65);
  cursor:grab;
}
body.editing-controls .b:active{transform:scale(1.06);cursor:grabbing}
#editBar{
  display:none;position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));
  transform:translateX(-50%);z-index:80;
  background:rgba(10,14,24,.94);border:2px solid #38e8ff;border-radius:14px;
  padding:8px 14px;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;
  box-shadow:0 8px 24px rgba(0,0,0,.7);font-size:13px;
}
#editBar button{
  padding:7px 14px;border-radius:8px;border:1.5px solid #38e8ff;
  background:#14283b;color:#fff6e8;font:700 13px Georgia,serif;cursor:pointer;
}
#editBar button.primary{background:#38e8ff;color:#06131a}

#ov{
  position:fixed;inset:0;z-index:60;background:rgba(10,14,22,.93);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;gap:14px;overflow-y:auto;
}
#ov h1{font-size:32px;margin:0;letter-spacing:.02em;color:var(--ac)}
#tx{max-width:540px;width:100%;line-height:1.45;white-space:pre-line;margin:0;max-height:58vh;overflow-y:auto}
#ov button{
  font:17px Georgia,serif;padding:10px 22px;border-radius:8px;
  border:2px solid var(--ac);background:transparent;color:var(--fg);cursor:pointer;
}
#ov button:first-of-type{background:var(--ac);color:#08131a;font-weight:700}

#mapScreen{
  display:none;position:fixed;inset:0;z-index:65;
  background:radial-gradient(circle at 50% 35%,#2b1747 0%,#140b24 65%,#080410 100%);
  flex-direction:column;justify-content:space-between;
}
#mapTop{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
  background:linear-gradient(180deg,#592c0c,#2e1504);
  border-bottom:2px solid #d99b38;
}
#mapTitle{font:800 18px Georgia,serif;color:#ffe5a3}
#mapClose{
  width:36px;height:36px;border-radius:8px;border:2px solid #f2b84b;
  background:#3b1c06;color:#ffe5a3;font:900 18px sans-serif;cursor:pointer;
}
#mapCanvasWrap{position:relative;flex:1;width:100%;overflow:hidden}
#mapCv{display:block;width:100%;height:100%}
#mapBottom{
  padding:8px 16px calc(10px + env(safe-area-inset-bottom,0px));
  text-align:center;font:700 16px Georgia,serif;color:#ffe5a3;
  background:linear-gradient(0deg,#592c0c,#2e1504);
  border-top:2px solid #d99b38;
}

#rot{
  display:none;position:fixed;inset:0;z-index:99;background:#0d111a;color:#fff2e0;
  align-items:center;justify-content:center;text-align:center;font-size:24px;padding:24px;
}
@media (orientation:portrait){#rot{display:flex}}
#ts{
  position:fixed;inset:0;z-index:50;display:none;overflow:hidden;
  background:radial-gradient(circle at 32% 45%,#1d586e 0%,#132638 48%,#0b0f19 100%);
}
#logo{
  position:absolute;left:5vw;top:12vh;pointer-events:none;
}
#logo b{
  display:inline-block;font:900 min(14vh,8.5vw) "Trebuchet MS",Verdana,sans-serif;
  color:#aef7ff;letter-spacing:.02em;
  text-shadow:0 0 22px rgba(56,232,255,.75),0 4px 0 #0a2233;
}
#logo u{
  display:inline-block;text-decoration:none;font-size:.38em;color:#08131a;background:#38e8ff;
  border:2px solid #fff;border-radius:.4em;padding:.08em .38em;margin-left:.3em;
  vertical-align:top;transform:rotate(-6deg);
}
#logo small{
  display:block;margin-top:1vh;font:italic 700 clamp(12px,3vh,19px) Georgia,serif;
  color:#ffe3b8;letter-spacing:.08em;text-shadow:0 2px 6px rgba(0,0,0,.85);
}
#progCard{
  margin-top:10px;display:inline-block;padding:6px 12px;border-radius:10px;
  background:rgba(10,18,28,.78);border:1px solid rgba(106,240,255,.4);
  font:700 clamp(12px,2.4vh,15px) Georgia,serif;color:#aef7ff;
}
#menu{
  position:absolute;right:5vw;top:24%;width:min(34vw,290px);
  display:flex;flex-direction:column;gap:2vh;
}
#menu button{
  height:clamp(38px,10.5vh,56px);border:2px solid #aef7ff;border-radius:999px;color:#fff;
  font:800 clamp(15px,3.6vh,22px) "Trebuchet MS",Verdana,sans-serif;
  background:linear-gradient(180deg,#1b3b52,#0f2030);
  box-shadow:0 5px 0 rgba(0,0,0,.45),0 0 18px rgba(56,232,255,.22);cursor:pointer;
}
#menu button:active{transform:translateY(3px)}
#m1{height:clamp(46px,13vh,66px)!important;background:linear-gradient(180deg,#38e8ff,#1282a8)!important;color:#06131a!important}
.mp{
  display:block;width:100%;margin:5px 0;padding:9px 14px;border-radius:8px;
  border:1px solid rgba(106,240,255,.35);background:rgba(56,232,255,.16);
  color:#fff2e0;font:700 15px Georgia,serif;cursor:pointer;
}
.mp:disabled{opacity:.4;cursor:not-allowed}
</style>
</head>
<body>
<div id="rot">Please rotate your phone to landscape ↻</div>
<div id="flash"></div>
<canvas id="cv"></canvas>
<div id="hud"><span id="h1"></span><span id="h2"></span></div>
<div id="bn"></div>

<div id="editBar">
  <span>✥ Drag any button (Jump, Sword, Bolt, Move) where you want</span>
  <button id="saveLayoutBtn" class="primary">Save Layout</button>
  <button id="resetLayoutBtn">Reset Default</button>
  <button id="cancelLayoutBtn">Close</button>
</div>

<input type="file" id="spFile" accept="image/*" style="display:none">
<button id="MAPBTN" title="Open Level Node Map">Map</button>
<button id="SPBTN" title="Optional: Load your 4-pose sprite sheet image">Load Sprite</button>

<div class="b" id="L">◀</div>
<div class="b" id="R">▶</div>
<div class="b" id="EN">Enter</div>
<div class="b" id="SH">Shop</div>
<div class="b" id="M">Bolt</div>
<div class="b" id="A">Sword</div>
<div class="b" id="J">Jump</div>

<div id="mapScreen">
  <div id="mapTop">
    <div id="mapTitle">Portal Map — <span id="mapPct">0%</span> Played</div>
    <button id="mapClose">✕</button>
  </div>
  <div id="mapCanvasWrap"><canvas id="mapCv"></canvas></div>
  <div id="mapBottom"><span id="mapRealmName">World's End Keep</span></div>
</div>

<div id="ts">
 <div id="logo">
  <b>Snowdigo<u>2D</u></b>
  <small>8 Realms • Seek the Mageblade • Master the Lightning</small>
  <div id="progCard">Player (<span id="menuPct">0%</span>) • <span id="menuRealm">1. Forest Realm</span></div>
 </div>
 <div id="menu">
  <button id="m1">▶ Start</button>
  <button id="m2">✦ Realms & Map</button>
  <button id="m3">✥ Controls</button>
  <button id="m4">★ Story</button>
 </div>
</div>

<div id="ov">
 <h1 id="h">Snowdigo 2D</h1>
 <div id="tx"></div>
 <button id="b1"></button>
 <button id="b2"></button>
</div>

<script>
const $=id=>document.getElementById(id),ov=$('ov'),flEl=$('flash'),cv=$('cv'),ctx=cv.getContext('2d');
const T={l:0,r:0,jh:0,jp:0,ap:0,mp:0,sp:0,ep:0,up:0},K={};
let editingControls=false,prevStateBeforeEdit='menu';

const BTN_IDS=['L','R','EN','SH','M','A','J'];
let customPositions={};

function loadCustomLayout(){
 try{
  const raw=localStorage.getItem('sd_custom_btns_v1');
  customPositions=raw?JSON.parse(raw):{};
 }catch(e){customPositions={}}
 applyCustomLayout();
}

function applyCustomLayout(){
 BTN_IDS.forEach(id=>{
  const el=$(id);
  if(!el)return;
  const pos=customPositions[id];
  if(pos && typeof pos.left==='number' && typeof pos.top==='number'){
   el.style.left=pos.left+'px';
   el.style.top=pos.top+'px';
   el.style.right='auto';
   el.style.bottom='auto';
  }else{
   el.style.left='';
   el.style.top='';
   el.style.right='';
   el.style.bottom='';
  }
 });
}

function saveCustomLayout(){
 BTN_IDS.forEach(id=>{
  const el=$(id);
  if(!el)return;
  const rect=el.getBoundingClientRect();
  customPositions[id]={left:Math.round(rect.left),top:Math.round(rect.top)};
 });
 try{localStorage.setItem('sd_custom_btns_v1',JSON.stringify(customPositions))}catch(e){}
 applyCustomLayout();
 banner('Custom Button Layout Saved!');
}

function resetCustomLayout(){
 customPositions={};
 try{localStorage.removeItem('sd_custom_btns_v1')}catch(e){}
 applyCustomLayout();
 banner('Default Button Positions Restored!');
}

function startControlEditor(){
 editingControls=true;
 prevStateBeforeEdit=(st==='play'?'play':'menu');
 st='pause';
 ov.style.display='none';
 $('ts').style.display='none';
 document.body.classList.add('editing-controls');
 $('editBar').style.display='flex';
 BTN_IDS.forEach(id=>{
  const el=$(id);
  if(!el)return;
  const r=el.getBoundingClientRect();
  el.style.left=r.left+'px';
  el.style.top=r.top+'px';
  el.style.right='auto';
  el.style.bottom='auto';
 });
}

function stopControlEditor(shouldSave){
 if(shouldSave)saveCustomLayout();
 editingControls=false;
 document.body.classList.remove('editing-controls');
 $('editBar').style.display='none';
 if(prevStateBeforeEdit==='play'){
  st='play';
 }else{
  st='menu';
  $('ts').style.display='block';
 }
}

$('saveLayoutBtn').onclick=()=>stopControlEditor(true);
$('resetLayoutBtn').onclick=()=>resetCustomLayout();
$('cancelLayoutBtn').onclick=()=>stopControlEditor(false);

BTN_IDS.forEach(id=>{
 const el=$(id);
 let dragging=false,offsetX=0,offsetY=0;
 el.addEventListener('pointerdown',e=>{
  if(!editingControls)return;
  e.preventDefault();e.stopPropagation();
  dragging=true;
  el.setPointerCapture(e.pointerId);
  const r=el.getBoundingClientRect();
  offsetX=e.clientX-r.left;
  offsetY=e.clientY-r.top;
 },true);
 el.addEventListener('pointermove',e=>{
  if(!editingControls||!dragging)return;
  e.preventDefault();e.stopPropagation();
  const maxX=window.innerWidth-el.offsetWidth-8;
  const maxY=window.innerHeight-el.offsetHeight-8;
  const nx=Math.max(8,Math.min(maxX,e.clientX-offsetX));
  const ny=Math.max(8,Math.min(maxY,e.clientY-offsetY));
  el.style.left=nx+'px';
  el.style.top=ny+'px';
 },true);
 el.addEventListener('pointerup',e=>{
  if(!editingControls||!dragging)return;
  dragging=false;
 },true);
});

addEventListener('keydown',e=>{
 K[e.code]=1;
 if(e.repeat)return;
 if(['Space','ArrowUp','KeyW'].includes(e.code))T.jp=1;
 if(['KeyJ','KeyZ'].includes(e.code))T.ap=1;
 if(['KeyK','KeyX'].includes(e.code))T.mp=1;
 if(['KeyE','KeyC'].includes(e.code))T.sp=1;
 if(['KeyF','Enter'].includes(e.code))T.ep=1;
 if(e.code.startsWith('Arrow')||e.code=='Space')e.preventDefault();
});
addEventListener('keyup',e=>K[e.code]=0);

[['L','l'],['R','r'],['J','jh'],['A','ap'],['M','mp'],['SH','sp'],['EN','ep']].forEach(([id,k])=>{
 const el=$(id),hold=k=='l'||k=='r'||k=='jh';
 el.addEventListener('pointerdown',e=>{
  if(editingControls)return;
  e.preventDefault();T[k]=1;if(k=='jh')T.jp=1;
 });
 if(hold)['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,()=>T[k]=0));
});

let spriteSheet=null;
$('SPBTN').onclick=()=>$('spFile').click();
$('spFile').onchange=e=>{
 const file=e.target.files[0];if(!file)return;
 const img=new Image();
 img.onload=()=>{
  const off=document.createElement('canvas');off.width=img.width;off.height=img.height;
  const oc=off.getContext('2d');oc.drawImage(img,0,0);
  const idata=oc.getImageData(0,0,off.width,off.height),d=idata.data;
  const bgR=d[0],bgG=d[1],bgB=d[2];
  for(let i=0;i<d.length;i+=4){
   const dist=Math.hypot(d[i]-bgR,d[i+1]-bgG,d[i+2]-bgB);
   if(dist<36)d[i+3]=0;
   else if(dist<55)d[i+3]=Math.floor(((dist-36)/19)*255);
  }
  oc.putImageData(idata,0,0);
  spriteSheet=off;
  banner('Custom 2D Anime Sprite Sheet Loaded!');
 };
 img.src=URL.createObjectURL(file);
};

let AC,mute=0;
function sfx(f,d=.1,ty='square',v=.045,f2){
 if(mute)return;
 try{
  AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  if(AC.state=='suspended')AC.resume();
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=ty;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);
 }catch(e){}
}
function triggerFlash(strength=.55){
 shk=Math.max(shk,.22);
 flEl.style.opacity=strength;
 clearTimeout(triggerFlash.t);
 triggerFlash.t=setTimeout(()=>flEl.style.opacity=0,95);
}

let W=window.innerWidth||800,H=window.innerHeight||450,DPR=Math.min(window.devicePixelRatio||1,2);
let mapNodes=[];

// Dark 2D Swordigo-style realm themes
const Z=[
 {id:'forest',n:'1. Dark Forest',m:'Enter houses, bounce on rope traps, & defeat Corruptor.',w:'Shards',k:3,e:4,sky:['#091417','#132c33','#1e474f'],mt:['#10262b','#081518'],c:'#2d1e14',cap:'#23693c',ec:'#2b6138',sc:'#38e8ff',f0:196,g:34,village:1,boss:{n:'Corruptor',hp:8,c:'#264d21',c2:'#ffbe2e'}},
 {id:'desert',n:'2. Dark Desert',m:'Leap across desert sea & rope traps, & beat Sand Golem.',w:'Shards',k:3,e:5,sky:['#261309','#5c2b12','#8f471e'],mt:['#47210e','#291106'],c:'#5e3a16',cap:'#9e692c',ec:'#8a4614',sc:'#4affd0',f0:165,g:34,sp:1,boss:{n:'Sand Golem',hp:10,c:'#6e4312',c2:'#ffd23a'}},
 {id:'ice',n:'3. Dark Ice Peaks',m:'Cross frozen cliffs & rope traps, & defeat Ice Overseer.',w:'Shards',k:3,e:5,sky:['#08182b','#14375c','#225a8c'],mt:['#133354','#091b2e'],c:'#2c425c',cap:'#9ed8f5',ec:'#1f5e8c',sc:'#6af0ff',f0:174,g:34,ice:1,boss:{n:'Ice Overseer',hp:12,c:'#296696',c2:'#ffffff'}},
 {id:'volcano',n:'4. Lava Cavern',m:'Bounce past molten lava & rope traps, & beat Flame King.',w:'Shards',k:4,e:6,sky:['#140407','#420c0e','#8a240e'],mt:['#260709','#140305'],c:'#1c1012',cap:'#8a2211',ec:'#a82814',sc:'#ffd23a',f0:147,g:34,lava:1,boss:{n:'Flame King',hp:15,c:'#2e0e14',c2:'#ff7b1a'}},
 {id:'ocean',n:'5. Abyssal Sea',m:'Swim & bounce across deep waters & beat Leviathan.',w:'Shards',k:4,e:6,sky:['#02101c','#06293d','#0c4b66'],mt:['#052030','#02121c'],c:'#11313d',cap:'#22786d',ec:'#9e2c61',sc:'#7cf9ff',f0:155,g:19,fl:1,boss:{n:'Abyss Leviathan',hp:17,c:'#0b344a',c2:'#ff6ab0'}},
 {id:'haunted',n:'6. Haunted Manor',m:'Brave the night manor & rope traps & beat Dread Lord.',w:'Shards',k:4,e:7,sky:['#090617','#191233','#342759'],mt:['#120c26','#080514'],c:'#1b1726',cap:'#3b3352',ec:'#572270',sc:'#b87aff',f0:138,g:34,maw:1,boss:{n:'Dread Lord',hp:19,c:'#1b112e',c2:'#b87aff'}},
 {id:'sky',n:'7. Storm Citadel',m:'Leap across storm clouds & rope traps & beat Sky Archon.',w:'Shards',k:4,e:7,sky:['#112547','#214578','#386ba8'],mt:['#1a3661','#0e1f38'],c:'#3b2b1d',cap:'#368247',ec:'#255696',sc:'#fff066',f0:220,g:24,fl:1,boss:{n:'Sky Archon',hp:21,c:'#1d437d',c2:'#ffe14a'}},
 {id:'dark',n:'8. Shadow Keep',m:'Storm the chained citadel & defeat Master of Chaos!',w:'Shards',k:5,e:8,sky:['#05020c','#16062b','#320e5c'],mt:['#0f041f','#070212'],c:'#120c1c',cap:'#471882',ec:'#731f99',sc:'#38e8ff',f0:131,g:34,maw:1,boss:{n:'Master of Chaos',hp:26,c:'#140729',c2:'#d65cff'}}
];

let pl,en,sh,pj,fx,hz,hr,ch,AR,boss,portal,shopSpot,doors,ropeTraps,inside,roomEnemy,roomChest,props,ambient;
let Z0=0,col=0,coins=120,xp=0,lvl=1,trinket='None',open=0,bd=0,st='menu',inv=0,cx=0,cy=0,tt=0,mx=0,shk=0,mn=0;
let camZoomMul=1;
try{
 mx=+localStorage.getItem('sd3b')||0;
 coins=+localStorage.getItem('sd3c')||120;
 xp=+localStorage.getItem('sd3x')||0;
 lvl=+localStorage.getItem('sd3l')||1;
}catch(e){}

function getPlayedPercent(){
 const totalRealms=Z.length;
 const realmSpan=100/totalRealms;
 const completedRealms=Math.min(mx,totalRealms);
 let pct=completedRealms*realmSpan;
 if(completedRealms<totalRealms){
  const q=Z[Z0]||{k:3};
  const shardRatio=q.k?Math.min(1,col/q.k):0;
  const bossRatio=bd?1:0;
  const inRealmProgress=((shardRatio*0.65)+(bossRatio*0.35))*realmSpan;
  pct=Math.max(pct,Z0*realmSpan+inRealmProgress);
 }
 const levelBoost=Math.min(4,(lvl-1)*0.5);
 return Math.max(0,Math.min(100,Math.round(pct+levelBoost)));
}

function updateProgressUI(){
 const pct=getPlayedPercent();
 const activeIdx=Math.min(Math.max(Z0,mx),Z.length-1);

function buildMapNodes(w,h){
 mapNodes=[];
 const padX=w*0.09,spanX=w*0.82;
 const midY=h*0.52;
 const stepY=Math.min(h*0.18,62);

 Z.forEach((realm,idx)=>{
  const realmIdx=idx;
  const unlocked=realmIdx<=mx;
  const isBoss=(idx===Z.length-1||idx===3||idx===5);
  const stars=realmIdx<mx?3:(realmIdx===mx?(col>=realm.k?2:(col>0?1:0)):0);
  const xNorm=(idx/(Z.length-1));
  const yOff=Math.sin(idx*1.45)*stepY*1.25;
  mapNodes.push({
   id:'r_'+idx,
   realmIdx,
   label:realm.n.replace(/^\d+\.\s*/,''),
   x:padX+xNorm*spanX,
   y:midY+yOff,
   unlocked,
   isBoss,
   stars
  });
  if(idx<Z.length-1){
   const nextX=padX+((idx+1)/(Z.length-1))*spanX;
   const subY=(yOff>0)?(midY-stepY*1.35):(midY+stepY*1.35);
   mapNodes.push({
    id:'sub_'+idx,
    realmIdx:idx,
    label:realm.n.replace(/^\d+\.\s*/,'')+' Path',
    x:(mapNodes[mapNodes.length-1].x+nextX)*0.5,
    y:subY,
    unlocked,
    isBoss:false,
    stars:realmIdx<mx?2:0,
    isSub:true
   });
  }
 });
}

function drawMapScreen(){
 const w=mapCv.width/DPR,h=mapCv.height/DPR;
 mctx.clearRect(0,0,w,h);

 mctx.fillStyle='rgba(255,255,255,0.22)';
 for(let i=0;i<36;i++){
  const sx=((i*97)%Math.max(100,w));
  const sy=((i*53)%Math.max(80,h));
  mctx.fillRect(sx,sy,2,2);
 }

 mctx.lineWidth=3.5;
 for(let i=0;i<mapNodes.length-1;i++){
  const a=mapNodes[i],b=mapNodes[i+1];
  mctx.strokeStyle=(a.unlocked&&b.unlocked)?'#e8b348':'#54486b';
  mctx.beginPath();mctx.moveTo(a.x,a.y);mctx.lineTo(b.x,b.y);mctx.stroke();
 }

 for(const nd of mapNodes){
  const r=nd.isSub?16:23;
  mctx.save();mctx.translate(nd.x,nd.y);

  if(!nd.isSub && nd.realmIdx===Z0){
   mctx.shadowColor='#38e8ff';mctx.shadowBlur=18;
  }

  mctx.beginPath();
  for(let k=0;k<6;k++){
   const ang=k*Math.PI/3;
   const px=Math.cos(ang)*r,py=Math.sin(ang)*r;
   if(k===0)mctx.moveTo(px,py);else mctx.lineTo(px,py);
  }
  mctx.closePath();

  if(!nd.unlocked){
   mctx.fillStyle='#4a4458';mctx.strokeStyle='#7a728c';
  }else if(nd.realmIdx===Z0 && !nd.isSub){
   mctx.fillStyle='#f5c451';mctx.strokeStyle='#38e8ff';
  }else{
   mctx.fillStyle='#d99b38';mctx.strokeStyle='#ffe49e';
  }
  mctx.lineWidth=2.5;
  mctx.fill();mctx.stroke();
  mctx.shadowBlur=0;

  if(!nd.unlocked){
   mctx.fillStyle='#e5def5';mctx.font='bold 13px sans-serif';mctx.textAlign='center';mctx.textBaseline='middle';
   mctx.fillText('🔒',0,0);
  }else if(nd.isBoss){
   mctx.fillStyle='#241208';mctx.font='bold 15px sans-serif';mctx.textAlign='center';mctx.textBaseline='middle';
   mctx.fillText('☠',0,-1);
  }else if(!nd.isSub){
   mctx.fillStyle='#241208';mctx.font='bold 12px Georgia,serif';mctx.textAlign='center';mctx.textBaseline='middle';
   mctx.fillText(String(nd.realmIdx+1),0,0);
  }

  if(nd.unlocked && !nd.isSub){
   const stStr='★'.repeat(nd.stars)+'☆'.repeat(Math.max(0,3-nd.stars));
   mctx.fillStyle='#ffe885';mctx.font='bold 11px sans-serif';mctx.textAlign='center';
   mctx.fillText(stStr,0,r+12);
  }

  if(!nd.isSub){
   mctx.fillStyle='#fff6e8';mctx.font='bold 10px Georgia,serif';mctx.textAlign='center';
   mctx.fillText(nd.label,0,-r-8);
  }

  mctx.restore();
 }
}

 p.vx+=Math.max(-friction*dt,Math.min(friction*dt,targetVx-p.vx));

 p.coy-=dt;p.jb-=dt;

 }
 if(!jh&&p.vy>4.5&&!floatMode)p.vy-=82*dt;

 p.vy=Math.max(-(floatMode?8:28),p.vy-grav*dt);

 ctx.translate(sx,sy);

 if(spriteSheet){
  const hw=spriteSheet.width/2,hh=spriteSheet.height/2;
  const colIdx=(pose=='run'||pose=='slash')?1:0;
  const rowIdx=(pose=='jump'||pose=='slash')?1:0;

  ctx.drawImage(spriteSheet,colIdx*hw,rowIdx*hh,hw,hh,-dw*.5,-dh*.92,dw,dh);

  ctx.translate(0,-45);

 let bodyTilt=0,bobY=0,lHip=0.25,lKnee=0.2,rHip=-0.35,rKnee=0.35,swAng=-0.55;
 if(pose=='run'){
  bodyTilt=0.24;bobY=Math.abs(Math.sin(phase))*5;

  rHip=-Math.sin(phase)*0.85;rKnee=Math.max(0.1,-Math.sin(phase-0.8)*0.9);

 }else if(pose=='jump'){

 }else if(pose=='slash'){
  if(isUpSlash){
   bodyTilt=-0.12;lHip=0.35;lKnee=0.3;rHip=-0.4;rKnee=0.3;
   swAng=-2.9+atkProg*1.75;
  }else if(comboStep===1){
   bodyTilt=0.32;lHip=0.65;lKnee=0.35;rHip=-0.7;rKnee=0.2;
   swAng=1.2-atkProg*2.65;
  }else{

 drawLeg(-7,rHip,rKnee,true);

 ctx.fillStyle='#ffffff';ctx.beginPath();ctx.ellipse(6,-1,4.2,2.6,0,0,Math.PI*2);ctx.fill();

function draw(){
 const q=Z[Z0],sp=Math.min(1,Math.abs(p.vx)/p.spd),air=!p.g,ph=tt*(13+sp*6);
 shk=Math.max(0,shk-0.016);
 const kx=(Math.random()-.5)*shk*28,ky=(Math.random()-.5)*shk*28;

 const targetX=inside?p.x*.25:p.x+p.f*2.2;
 const targetY=inside?1.6:Math.max(p.y,0)*.52+2.3;
 cx+=(targetX-cx)*.12;
 cy+=(targetY-cy)*.1;

 const ppm=Math.min(W,H)*0.074*camZoomMul;
 const toSX=wx=>W*0.5+(wx-cx)*ppm+kx;
 const toSY=wy=>H*0.78-(wy-cy+1.6)*ppm+ky;

 const sg=ctx.createLinearGradient(0,0,0,H);
 if(inside){
  sg.addColorStop(0,'#0c0912');sg.addColorStop(1,'#1d1426');
 }else{
  sg.addColorStop(0,q.sky[0]);sg.addColorStop(.55,q.sky[1]);sg.addColorStop(1,q.sky[2]);
 }
 ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);

 if(inside){
  const rx0=toSX(-8),rx1=toSX(8),ryTop=toSY(5.5),ryFloor=toSY(0);
  ctx.fillStyle='#16101f';ctx.fillRect(rx0,ryTop,rx1-rx0,ryFloor-ryTop);
  ctx.strokeStyle='#362645';ctx.lineWidth=4;ctx.strokeRect(rx0,ryTop,rx1-rx0,ryFloor-ryTop);

  [-3.8,3.8].forEach(tx=>{
   const sx=toSX(tx),sy=toSY(2.8);
   ctx.fillStyle='#4a2e18';ctx.fillRect(sx-4,sy,8,28);
   const g=ctx.createRadialGradient(sx,sy-4,2,sx,sy-4,48);
   g.addColorStop(0,'rgba(255,210,90,0.85)');g.addColorStop(1,'rgba(255,120,20,0)');
   ctx.fillStyle=g;ctx.beginPath();ctx.arc(sx,sy-4,48,0,Math.PI*2);ctx.fill();
  });

  const dx=toSX(-5.5),dy=toSY(0);
  ctx.fillStyle='#4a2812';ctx.strokeStyle='#140a03';ctx.lineWidth=3;
  ctx.fillRect(dx-24,dy-74,48,74);ctx.strokeRect(dx-24,dy-74,48,74);
  ctx.fillStyle='#ffe5a3';ctx.font='bold 11px Georgia';ctx.textAlign='center';ctx.fillText('EXIT',dx,dy-80);

  if(roomChest){
   const chx=toSX(roomChest.x),chy=toSY(0);
   ctx.fillStyle=roomChest.opened?'#7a4c20':'#5c2f10';ctx.strokeStyle='#120802';ctx.lineWidth=2.5;
   ctx.fillRect(chx-24,chy-32,48,32);ctx.strokeRect(chx-24,chy-32,48,32);
   ctx.fillStyle=roomChest.unlocked?'#ffd23a':'#ff3b5c';
   ctx.beginPath();ctx.arc(chx,chy-18,6,0,Math.PI*2);ctx.fill();
  }

  ctx.fillStyle='#382517';ctx.fillRect(rx0,ryFloor,rx1-rx0,H-ryFloor);
  ctx.fillStyle='#5e4029';ctx.fillRect(rx0,ryFloor,rx1-rx0,8);

  if(roomEnemy&&roomEnemy.alive){
   const ex=toSX(roomEnemy.x),ey=toSY(roomEnemy.y);
   ctx.fillStyle=roomEnemy.fl>0?'#ffffff':'#851f3d';ctx.strokeStyle='#0d0509';ctx.lineWidth=2.5;
   ctx.beginPath();ctx.arc(ex,ey,20,0,Math.PI*2);ctx.fill();ctx.stroke();
   ctx.fillStyle='#ffd23a';ctx.fillRect(ex-8,ey-5,5,5);ctx.fillRect(ex+3,ey-5,5,5);
  }
 }else{
  drawRealmBackdrop(q,ppm,toSX,toSY);

  for(const a of ambient){
   a.x+=a.vx*0.016;a.y+=a.vy*0.016;
   if(a.x>cx+28)a.x-=56;if(a.x<cx-28)a.x+=56;
   if(a.y>16)a.y=-2;if(a.y<-2)a.y=16;
   const sx=toSX(a.x),sy=toSY(a.y);
   ctx.fillStyle=a.c;ctx.globalAlpha=0.55;
   ctx.beginPath();
   if(q.id=='ocean')ctx.arc(sx,sy,a.sz*1.1,0,Math.PI*2);
   else ctx.ellipse(sx,sy,a.sz*2.0,a.sz*.65,-.2,0,Math.PI*2);
   ctx.fill();
  }
  ctx.globalAlpha=1;

  // Dark 2D Houses (tap or press Enter to go inside)
  doors.forEach(d=>{
   const dx=toSX(d.x),dy=toSY(0);
   ctx.fillStyle='#3b2515';ctx.strokeStyle='#0c0704';ctx.lineWidth=2.8;
   ctx.fillRect(dx-44,dy-60,88,60);ctx.strokeRect(dx-44,dy-60,88,60);
   ctx.fillStyle='#192a4a';ctx.beginPath();ctx.moveTo(dx-54,dy-60);ctx.lineTo(dx,dy-96);ctx.lineTo(dx+54,dy-60);ctx.closePath();ctx.fill();ctx.stroke();
   ctx.fillStyle='#1f1006';ctx.fillRect(dx-12,dy-36,24,36);ctx.strokeRect(dx-12,dy-36,24,36);
   ctx.fillStyle='#f5c451';ctx.fillRect(dx-32,dy-42,14,14);ctx.fillRect(dx+18,dy-42,14,14);
   ctx.fillStyle='#aef7ff';ctx.font='bold 10px Georgia';ctx.textAlign='center';ctx.fillText('HOUSE',dx,dy-102);
  });

  if(shopSpot){
   const dx=toSX(shopSpot.x),dy=toSY(0);
   ctx.fillStyle='#332216';ctx.strokeStyle='#0c0704';ctx.lineWidth=2.8;
   ctx.fillRect(dx-48,dy-64,96,64);ctx.strokeRect(dx-48,dy-64,96,64);
   ctx.fillStyle='#154061';ctx.beginPath();ctx.moveTo(dx-58,dy-64);ctx.lineTo(dx,dy-102);ctx.lineTo(dx+58,dy-64);ctx.closePath();ctx.fill();ctx.stroke();
   ctx.fillStyle='#ffd23a';ctx.font='bold 11px Georgia';ctx.textAlign='center';ctx.fillText('SHOP',dx,dy-48);
  }

  for(const pr of props){
   const sx=toSX(pr.x),sy=toSY(0);
   if(sx<-120||sx>W+120)continue;
   drawRealmProp(q,pr,sx,sy);
  }

  // Rope Bounce Traps suspended over gaps
  for(const rt of ropeTraps){
   const rx=toSX(rt.x),ry=toSY(rt.y+Math.sin(rt.swingPhase)*0.16);
   const rw=rt.w*ppm*0.5;
   ctx.save();
   ctx.strokeStyle='#9e6e34';ctx.lineWidth=2.5;
   ctx.beginPath();ctx.moveTo(rx-rw,ry-36);ctx.lineTo(rx-rw,ry);ctx.moveTo(rx+rw,ry-36);ctx.lineTo(rx+rw,ry);ctx.stroke();
   ctx.strokeStyle=rt.bounce>0?'#38e8ff':'#e6b355';
   ctx.lineWidth=rt.bounce>0?6:4.5;
   ctx.beginPath();ctx.moveTo(rx-rw,ry);ctx.quadraticCurveTo(rx,ry+(rt.bounce>0?12:5),rx+rw,ry);ctx.stroke();
   ctx.restore();
  }

  const pitY=toSY(-1.1);
  if(q.id=='volcano'){
   const lg=ctx.createLinearGradient(0,pitY,0,H);
   lg.addColorStop(0,'#ff8c1a');lg.addColorStop(0.35,'#cc2b0e');lg.addColorStop(1,'#420604');
   ctx.fillStyle=lg;ctx.fillRect(0,pitY,W,H-pitY);
  }else if(q.id=='sky'){
   ctx.fillStyle='rgba(200,225,255,0.28)';ctx.fillRect(0,pitY+24,W,H-pitY);
  }

  for(const f of pl){
   const x0=toSX(f.a),x1=toSX(f.b),y0=toSY(f.y);
   if(x1<-40||x0>W+40)continue;
   const h=(f.y<=0&&q.id!='sky')?H-y0:22;
   ctx.fillStyle=q.c;ctx.fillRect(x0,y0,x1-x0,h);
   ctx.fillStyle=q.cap;ctx.fillRect(x0-2,y0-2,x1-x0+4,9);
   ctx.strokeStyle='#0a0d12';ctx.lineWidth=2.2;ctx.strokeRect(x0,y0,x1-x0,h);
  }

  for(const h of hz){
   const sx=toSX(h.x),sy=toSY(0);
   ctx.fillStyle=q.id=='volcano'?'#ff7714':'#d9385a';ctx.strokeStyle='#090b10';ctx.lineWidth=2;
   ctx.beginPath();
   ctx.moveTo(sx-12,sy);ctx.lineTo(sx-6,sy-20);ctx.lineTo(sx,sy);
   ctx.lineTo(sx+6,sy-22);ctx.lineTo(sx+12,sy);ctx.closePath();ctx.fill();ctx.stroke();
  }

  for(const c of ch){
   const sx=toSX(c.x),sy=toSY(c.y);
   ctx.fillStyle=c.open?'#855426':'#5e300e';ctx.strokeStyle='#0d0702';ctx.lineWidth=2;
   ctx.fillRect(sx-16,sy-22,32,22);ctx.strokeRect(sx-16,sy-22,32,22);
   ctx.fillStyle='#ffd23a';ctx.fillRect(sx-3,sy-14,6,6);
  }

  for(const s of sh){
   const sx=toSX(s.x),sy=toSY(s.y+Math.sin(tt*3+s.x)*.14);
   ctx.save();ctx.translate(sx,sy);ctx.shadowColor=q.sc;ctx.shadowBlur=14;
   ctx.fillStyle=q.sc;ctx.beginPath();
   ctx.moveTo(0,-14);ctx.lineTo(10,0);ctx.lineTo(0,14);ctx.lineTo(-10,0);ctx.closePath();ctx.fill();
   ctx.restore();
  }

  for(const h of hr){
   const sx=toSX(h.x),sy=toSY(h.y+Math.sin(tt*3+h.x)*.1);
   ctx.fillStyle='#e03655';ctx.strokeStyle='#0a0507';ctx.lineWidth=1.8;
   ctx.beginPath();ctx.arc(sx,sy,8,0,Math.PI*2);ctx.fill();ctx.stroke();
  }

  const px=toSX(portal.x),py=toSY(portal.y);
  ctx.save();ctx.translate(px,py);
  ctx.strokeStyle=open?'#38e8ff':'#485266';ctx.lineWidth=5;
  ctx.beginPath();ctx.arc(0,0,28,0,Math.PI*2);ctx.stroke();
  if(open){ctx.fillStyle='rgba(56,232,255,0.28)';ctx.fill()}
  ctx.restore();

  for(const e of en){
   const ex=toSX(e.x),ey=toSY(e.y);
   ctx.save();ctx.translate(ex,ey);
   if(e.t=='b'){
    ctx.fillStyle=e.fl>0?'#ffffff':q.boss.c;ctx.strokeStyle='#090b10';ctx.lineWidth=3;
    ctx.beginPath();ctx.roundRect(-34,-38,68,74,14);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ff3322';ctx.fillRect(-18,-18,11,8);ctx.fillRect(7,-18,11,8);
   }else{
    ctx.fillStyle=e.fl>0?'#ffffff':q.ec;ctx.strokeStyle='#090b10';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ffd23a';ctx.fillRect(-7,-5,4,4);ctx.fillRect(3,-5,4,4);
   }
   ctx.restore();
  }
 }

 for(const b of pj){
  const bx=toSX(b.x),by=toSY(b.y);
  ctx.save();ctx.shadowColor=b.c;ctx.shadowBlur=12;
  ctx.fillStyle=b.c;ctx.beginPath();ctx.arc(bx,by,b.own?8:7,0,Math.PI*2);ctx.fill();
  ctx.restore();
 }

 for(const f of fx){
  ctx.globalAlpha=Math.max(0,f.l/f.ml);
  ctx.fillStyle=f.c;ctx.fillRect(toSX(f.x)-f.sz*.5,toSY(f.y)-f.sz*.5,f.sz,f.sz);
 }
 ctx.globalAlpha=1;

 if(inv<=0||Math.floor(inv*14)%2==0){
  const pose=p.atk>0?'slash':(air?'jump':(sp>0.12?'run':'idle'));
  const atkProg=p.atk>0?(1-p.atk/.28):0;
  const spinProg=(air&&p.j>=2&&p.vy>2)?Math.min(1,(p.vy-2)/10):0;
  drawAnimeHero(toSX(p.x),toSY(p.y),ppm*1.08,p.f,pose,ph,atkProg,p.upSlash,p.cs,spinProg);
 }

 const pctNow=getPlayedPercent();
 $('h1').textContent='❤'.repeat(Math.max(0,p.hp))+'  Lv.'+lvl+' ('+pctNow+'%)  |  🪙 '+coins;
 $('h2').textContent=inside
  ?(roomChest?.opened?'Chest Opened! Tap EXIT':roomChest?.unlocked?'Unlock Chest (Enter)!':'Defeat Guard!')
  :(open?'Go to the portal ►':q.w+' '+col+'/'+q.k+(boss&&!bd?'  |  '+q.boss.n+' '+boss.hp+'/'+boss.mh:''));
}

let last=performance.now();
function loop(n){
 requestAnimationFrame(loop);
 const dt=Math.min(.033,(n-last)/1000);last=n;tt+=dt;
 if(st=='play'&&innerWidth>innerHeight)upd(dt);

}
