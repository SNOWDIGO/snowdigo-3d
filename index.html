<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snowdigo 3D — Swordigo Base</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#120d18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#120d18;
  --fg:#fff6e8;
  --ac:#ff9424;
  --bt:rgba(16,12,26,.62);
}
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;background:var(--bg);overflow:hidden;
  touch-action:none;font-family:Georgia,"Times New Roman",serif;color:var(--fg);
  user-select:none;-webkit-user-select:none;
}
canvas{display:block;width:100%;height:100%}
#flash{
  position:fixed;inset:0;z-index:25;pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgba(120,248,255,.85) 0%,rgba(255,148,36,.45) 55%,rgba(255,255,255,0) 100%);
  transition:opacity .08s ease-out;
}
#hud{
  position:fixed;top:0;left:0;right:0;z-index:10;
  padding:calc(8px + env(safe-area-inset-top,0px)) 14px 0;
  display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:13px;pointer-events:none;text-shadow:0 2px 6px rgba(0,0,0,.92);
}
#hud span{
  background:rgba(14,10,22,.62);padding:5px 11px;border-radius:10px;
  border:1px solid rgba(255,246,232,.22);backdrop-filter:blur(4px);
}
#bn{
  position:fixed;top:16%;left:0;right:0;z-index:12;text-align:center;
  font-size:18px;white-space:pre-line;opacity:0;transition:opacity .45s;
  pointer-events:none;text-shadow:0 3px 10px rgba(0,0,0,.96);
}
.b{
  position:fixed;z-index:15;width:62px;height:62px;border-radius:18px;
  background:var(--bt);border:2px solid rgba(255,246,232,.5);color:var(--fg);
  font:700 13px Georgia,serif;display:flex;align-items:center;justify-content:center;
  touch-action:none;box-shadow:0 6px 16px rgba(0,0,0,.48);
}
.b:active{transform:scale(.93);background:rgba(255,246,232,.34)}
#L{left:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#R{left:88px;bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#J{right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#A{right:88px;bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#M{right:14px;bottom:calc(92px + env(safe-area-inset-bottom,0px));background:rgba(255,140,26,.45)}
#SH{right:88px;bottom:calc(92px + env(safe-area-inset-bottom,0px));background:rgba(70,185,255,.38);font-size:12px}
#EN{right:162px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:rgba(255,196,64,.36);font-size:12px}
#ov{
  position:fixed;inset:0;z-index:60;background:rgba(14,10,22,.92);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;gap:14px;
}
#ov h1{font-size:38px;margin:0;letter-spacing:.02em;color:var(--ac)}
#tx{max-width:520px;width:100%;line-height:1.5;white-space:pre-line;margin:0}
#ov button{
  font:17px Georgia,serif;padding:11px 24px;border-radius:8px;
  border:2px solid var(--ac);background:transparent;color:var(--fg);cursor:pointer;
}
#ov button:first-of-type{background:var(--ac);color:#1a1006}
#rot{
  display:none;position:fixed;inset:0;z-index:99;background:#120d18;color:#fff2e0;
  align-items:center;justify-content:center;text-align:center;font-size:24px;padding:24px;
}
@media (orientation:portrait){#rot{display:flex}}
/* Title screen */
#ts{
  position:fixed;inset:0;z-index:50;display:none;overflow:hidden;
  background:linear-gradient(#1b0b3a 0%,#4b1d7a 32%,#c2459a 62%,#ff9a6b 84%,#ffd08a 100%);
}
#ts svg{position:absolute;inset:0;width:100%;height:100%}
.st{
  position:absolute;border-radius:50%;background:#fff6c8;
  box-shadow:0 0 6px #ffe9a0;animation:tw 3s ease-in-out infinite;pointer-events:none;
}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.fl{animation:bob 4s ease-in-out infinite}.fl2{animation:bob 5s ease-in-out infinite reverse}
.sw{transform-box:fill-box;transform-origin:100% 50%;animation:sway 1.4s ease-in-out infinite}
.glow{animation:pulse 1.4s ease-in-out infinite}
.cl{animation:drift 9s ease-in-out infinite alternate}
#logo{
  position:absolute;left:0;right:0;top:3vh;text-align:center;
  pointer-events:none;animation:bob 3.5s ease-in-out infinite;
}
#logo b{
  display:inline-block;font:900 min(16vh,9.5vw) "Trebuchet MS","Arial Rounded MT Bold",Verdana,sans-serif;
  color:#ffe14a;letter-spacing:.01em;
  text-shadow:-2px -2px 0 #4a1a7a,2px -2px 0 #4a1a7a,-2px 2px 0 #4a1a7a,2px 2px 0 #4a1a7a,
    0 .06em 0 #e8821a,0 .12em 0 #4a1a7a,0 .2em .25em rgba(0,0,0,.4);
}
#logo u{
  display:inline-block;text-decoration:none;font-size:.42em;color:#fff;background:#ff3f7f;
  border:3px solid #fff;border-radius:.4em;padding:.05em .35em;margin-left:.3em;
  vertical-align:top;transform:rotate(-7deg);text-shadow:none;box-shadow:0 4px 0 #a01a52;
}
#logo small{
  display:block;margin-top:.5vh;font:italic 700 clamp(11px,3vh,18px) Georgia,serif;
  color:#fff;letter-spacing:.12em;text-shadow:0 2px 6px rgba(0,0,0,.7);
}
#menu{
  position:absolute;right:4vw;top:35%;width:min(34vw,290px);
  display:flex;flex-direction:column;gap:2vh;
}
#menu button{
  height:clamp(36px,10.5vh,56px);border:3px solid #fff;border-radius:999px;color:#fff;
  font:800 clamp(15px,3.8vh,24px) "Trebuchet MS",Verdana,sans-serif;
  text-shadow:0 2px 0 rgba(0,0,0,.3);
  box-shadow:0 5px 0 rgba(0,0,0,.35),0 0 18px rgba(255,255,255,.25);cursor:pointer;
}
#menu button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
#m1{height:clamp(44px,13vh,66px)!important;background:linear-gradient(#7dff8a,#1fb85a);animation:beat 1.3s ease-in-out infinite}
#m2{background:linear-gradient(#ffb3d9,#ff4f9a)}
#m3{background:linear-gradient(#8fdcff,#2f8fff)}
#m4{background:linear-gradient(#d9b3ff,#8a4fff)}
#m1::before{content:"\25B6  "}#m2::before{content:"\2726  "}#m3::before{content:"\2725  "}#m4::before{content:"\2605  "}
.mp{
  display:block;width:100%;margin:6px 0;padding:10px 14px;border-radius:8px;
  border:1px solid rgba(255,242,224,.35);background:rgba(255,140,26,.22);
  color:#fff2e0;font:700 16px Georgia,serif;cursor:pointer;
}
.mp:disabled{opacity:.4;cursor:not-allowed}
</style>
</head>
<body>

<div id="ts">
 <svg viewBox="0 0 1280 575" preserveAspectRatio="xMidYMax slice">

   <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7be37a"/><stop offset=".14" stop-color="#3fb55a"/><stop offset=".15" stop-color="#9a6a45"/><stop offset="1" stop-color="#4a2c3a"/></linearGradient>

  <path d="M0 575V430L110 350L210 420L330 320L450 425L570 360L690 440L820 340L950 430L1070 360L1170 430L1280 380V575Z" fill="#6a2f8f"/>
  <path d="M0 575V470L140 410L260 470L400 400L540 480L700 430L860 490L1020 420L1160 480L1280 440V575Z" fill="#3f1a63"/>

    <rect x="-18" y="70" width="14" height="24" fill="#7a4a2a"/><rect x="4" y="70" width="14" height="24" fill="#7a4a2a"/>
    <rect x="-21" y="92" width="20" height="10" rx="4" fill="#3a2014"/><rect x="1" y="92" width="20" height="10" rx="4" fill="#3a2014"/>
    <rect x="-22" y="24" width="44" height="48" rx="10" fill="#2fa862"/><rect x="-22" y="56" width="44" height="8" fill="#fff2d8"/>
    <circle cx="22" cy="30" r="9" fill="#d9a441"/>
    <circle cx="0" cy="0" r="24" fill="#f2c291"/>
    <path d="M-26-4L-30-30L-14-20L-10-40L0-24L12-42L16-20L32-30L26-4Q0-22-26-4Z" fill="#1a1424"/>
    <circle cx="-9" cy="4" r="4" fill="#1a1424"/><circle cx="9" cy="4" r="4" fill="#1a1424"/><circle cx="-8" cy="3" r="1.4" fill="#fff"/><circle cx="10" cy="3" r="1.4" fill="#fff"/>

     <rect class="glow" x="-9" y="-102" width="18" height="102" rx="8" fill="#ff8a2a" filter="url(#gl)"/>

 </svg>
 <div id="logo"><b>Snowdigo<u>3D</u></b><small>Seek the Mageblade. Restore the Light.</small></div>

  <button id="m1">Start</button>

 </div>

<div id="ov">
 <h1 id="h">Snowdigo 3D</h1>
 <div id="tx"></div>
 <button id="b1"></button>
 <button id="b2"></button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),ov=$('ov'),flEl=$('flash');
const T={l:0,r:0,jh:0,jp:0,ap:0,mp:0,sp:0,ep:0},K={};

addEventListener('keydown',e=>{
 K[e.code]=1;
 if(e.repeat)return;
 if(['Space','ArrowUp','KeyW'].includes(e.code))T.jp=1;
 if(['KeyJ','KeyZ'].includes(e.code))T.ap=1;
 if(['KeyK','KeyX'].includes(e.code))T.mp=1;
 if(['KeyE','KeyC'].includes(e.code))T.sp=1;
 if(['KeyF','Enter'].includes(e.code))T.ep=1;
 if(e.code.startsWith('Arrow')||e.code=='Space')e.preventDefault();
});
addEventListener('keyup',e=>K[e.code]=0);

[['L','l'],['R','r'],['J','jh'],['A','ap'],['M','mp'],['SH','sp'],['EN','ep']].forEach(([id,k])=>{
 const el=$(id),hold=k=='l'||k=='r'||k=='jh';
 el.addEventListener('pointerdown',e=>{e.preventDefault();T[k]=1;if(k=='jh')T.jp=1});
 if(hold)['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,()=>T[k]=0));
});

let AC,mute=0;
function sfx(f,d=.1,ty='square',v=.05,f2){
 if(mute)return;
 try{
  AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  if(AC.state=='suspended')AC.resume();
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=ty;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);
 }catch(e){}
}
function triggerFlash(strength=.65){
 shk=Math.max(shk,.25);
 flEl.style.opacity=strength;
 clearTimeout(triggerFlash.t);
 triggerFlash.t=setTimeout(()=>flEl.style.opacity=0,95);
}

const R=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
R.setPixelRatio(Math.min(devicePixelRatio,2));
R.shadowMap.enabled=true;
R.shadowMap.type=THREE.PCFSoftShadowMap;
R.toneMapping=THREE.ACESFilmicToneMapping;
R.toneMappingExposure=1.08;
document.body.prepend(R.domElement);

const S=new THREE.Scene();
const C=new THREE.PerspectiveCamera(45,1,.1,380);
const HL=new THREE.HemisphereLight(0xf6f8ff,0x2a1f38,1.08);
const DL=new THREE.DirectionalLight(0xfff1d4,1.25);
DL.position.set(12,20,15);
DL.castShadow=true;
DL.shadow.mapSize.set(1024,1024);
S.add(HL,DL);

function rs(){
 R.setSize(innerWidth,innerHeight);
 C.aspect=innerWidth/innerHeight;
 C.updateProjectionMatrix();
}
addEventListener('resize',rs);rs();

const mat=(c,e,r=.48,m=.15)=>new THREE.MeshStandardMaterial({
 color:c,emissive:e||0,emissiveIntensity:e?.35:0,roughness:r,metalness:m
});
const box=(w,h,d,c,x=0,y=0,z=0,p=S,shd=0,mt)=>{
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mt||mat(c));
 m.position.set(x,y,z);
 if(shd){m.castShadow=true;m.receiveShadow=true}
 p.add(m);return m;
};
const bas=(c,o)=>new THREE.MeshBasicMaterial({color:c,transparent:o!=null,opacity:o==null?1:o});

let sd=1;
const rn=()=>(sd=sd*16807%2147483647)/2147483647;

// ---------- Hero (Matching Reference Art) ----------
const P=new THREE.Group();S.add(P);
const BD=new THREE.Group();P.add(BD);
const pv=(x,y,par)=>{const g=new THREE.Group();g.position.set(x,y,0);par.add(g);return g};

const legL=pv(-.18,.95,BD),legR=pv(.18,.95,BD);
const armL=pv(-.46,1.6,BD),armR=pv(.46,1.6,BD);

// Dark warrior pants & boots
[legL,legR].forEach(l=>{
 box(.24,.62,.28,0x1d1c24,0,-.31,0,l,1);
 box(.28,.22,.36,0x141218,0,-.63,.05,l,1);
});

// White tunic + dark sash + waist sheath
box(.74,.74,.44,0xeef2f7,0,1.3,0,BD,1);
box(.78,.18,.48,0x1a1822,0,1.04,0,BD);
box(.68,.12,.46,0xd8dde6,0,.94,0,BD);
box(.1,.82,.1,0x16141e,-.38,1.02,.18,BD);

// Dark skin head, expressive eyes, and spiky dark hair
box(.5,.5,.5,0x6e4329,0,1.95,0,BD,1);
box(.58,.22,.58,0x14121c,0,2.24,0,BD);
[-.14,.14].forEach(x=>{
 box(.1,.08,.06,0x120e16,x,1.98,.27,BD);
 box(.04,.04,.07,0x8ef6ff,x+.02,1.99,.28,BD);
});
const spikeDirs=[
 [-.24,2.38,-.25],[-.12,2.52,.1],[0,2.58,-.15],[.14,2.52,.12],[.25,2.38,-.2],
 [-.28,2.24,.2],[.28,2.24,.2]
];
spikeDirs.forEach(([sx,sy,rz],i)=>{
 const c=new THREE.Mesh(new THREE.ConeGeometry(.12,.42+(i%2)*.08,5),mat(0x14121c));
 c.position.set(sx,sy,0);c.rotation.z=rz;BD.add(c);
});

// Arms + glowing cyan katana-style blade
[armL,armR].forEach(a=>{
 box(.2,.58,.22,0x6e4329,0,-.28,0,a,1);
 box(.22,.16,.24,0x1a1822,0,-.56,0,a);
});
const swd=pv(0,-.66,armR);swd.rotation.z=-1.15;
box(.09,1.3,.05,0xf2fcff,0,.76,0,swd,0,mat(0xf2fcff,0x38e8ff,.2,.75));
const aura=new THREE.Mesh(new THREE.BoxGeometry(.22,.12,.14),bas(0x38e8ff,.48));
aura.scale.set(1,11,1);aura.position.set(0,.76,0);swd.add(aura);
box(.42,.1,.16,0xe6b832,0,.1,0,swd);
box(.09,.28,.09,0x181620,0,-.08,0,swd);

// Flowing dark cloak
const sc=[];let s0=pv(-.34,1.74,BD);
for(let i=0;i<4;i++){
 box(.42,.24,.12,0x1d1b26,-.18,-i*.03,0,s0);
 const n=pv(-.38,-0.02,s0);sc.push(s0);s0=n;
}

const BL=new THREE.Mesh(new THREE.CircleGeometry(.58,18),bas(0x09060e,.4));
BL.rotation.x=-Math.PI/2;S.add(BL);
const SL=new THREE.Mesh(
 new THREE.RingGeometry(.95,1.85,24,1,-.95,1.9),
 new THREE.MeshBasicMaterial({color:0x6af0ff,transparent:true,opacity:0,side:2})
);
S.add(SL);

// ---------- Swordigo-Inspired Realms ----------
const Z=[
{n:'Cairnwood & Forest',m:'Find 3 Mageblade Shards, clear cottage guards, & defeat Corruptor.',w:'Shards',k:3,e:4,sky:['#182848','#6a9ec9'],fog:0x6b92b5,sun:0xffe9a8,c:0x5e4229,cap:0x368c3e,bc:[0x48698a,0x375748,0x264234],bs:0,ec:0x3c7a47,es:0,sc:0xffd23a,pc:0xffffff,pv:[.7,-.4],f0:196,g:30,cl:1,pit:0x163f5e,village:1,boss:{n:'Corruptor',hp:8,c:0x35692b,c2:0xffbe2e}},
{n:'Frost Peaks & Caves',m:'Collect 3 Frost Shards on icy ledges & defeat the Overseer.',w:'Shards',k:3,e:5,sky:['#0b1d42','#8ec2f0'],fog:0x88b8e3,sun:0xffffff,c:0x7698bd,cap:0xe6f6ff,bc:[0x58789c,0x7398bf,0x9ec2e3],bs:1,ec:0x3c84bd,es:1,sc:0x5af0ff,pc:0xffffff,pv:[-.9,-2.2],f0:174,g:30,ice:1,pit:0x102f52,boss:{n:'Overseer',hp:10,c:0x4ea0db,c2:0xffffff}},

 if(inside){

 }else{

 }

 if(T.ep){T.ep=0;tryEnter()}

 p.atk-=dt;p.mc-=dt;inv-=dt;p.cc-=dt;p.sq=Math.max(0,p.sq-dt*5);

 }}

 if(T.mp){T.mp=0;if(p.mc<=0){

 }}

 for(const b of pj.slice()){

     roomEnemy.alive=0;IW.remove(roomEnemy.m);coins+=25;gainXp(20);
     if(roomChest){roomChest.unlocked=1;roomChest.lockGem.material.color.set(0xffd23a);banner('Guard Defeated! Reward Chest Unlocked!')}

 }

 if(!inside){
