<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snowdigo 2D — Anime Action Fantasy</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d111a">
<style>
:root{
  --bg:#0d111a;
  --fg:#fff6e8;
  --ac:#38e8ff;
  --bt:rgba(13,17,26,.68);
}
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;background:var(--bg);overflow:hidden;
  touch-action:none;font-family:Georgia,"Times New Roman",serif;color:var(--fg);
  user-select:none;-webkit-user-select:none;
}
canvas{display:block;width:100%;height:100%}
#flash{
  position:fixed;inset:0;z-index:25;pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgba(106,240,255,.75) 0%,rgba(56,232,255,.25) 55%,rgba(255,255,255,0) 100%);
  transition:opacity .08s ease-out;
}
#hud{
  position:fixed;top:0;left:0;right:0;z-index:10;
  padding:calc(8px + env(safe-area-inset-top,0px)) 14px 0;
  display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:13px;pointer-events:none;text-shadow:0 2px 6px rgba(0,0,0,.92);
}
#hud span{
  background:rgba(12,16,26,.72);padding:5px 11px;border-radius:10px;
  border:1px solid rgba(106,240,255,.28);backdrop-filter:blur(4px);
}
#bn{
  position:fixed;top:15%;left:0;right:0;z-index:12;text-align:center;
  font-size:18px;white-space:pre-line;opacity:0;transition:opacity .45s;
  pointer-events:none;text-shadow:0 3px 10px rgba(0,0,0,.96);
}
.b{
  position:fixed;z-index:15;width:62px;height:62px;border-radius:18px;
  background:var(--bt);border:2px solid rgba(106,240,255,.45);color:var(--fg);
  font:700 13px Georgia,serif;display:flex;align-items:center;justify-content:center;
  touch-action:none;box-shadow:0 6px 16px rgba(0,0,0,.55);
}
.b:active{transform:scale(.93);background:rgba(106,240,255,.28)}
#L{left:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#R{left:88px;bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#J{right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#A{right:88px;bottom:calc(18px + env(safe-area-inset-bottom,0px));border-color:#38e8ff}
#M{right:14px;bottom:calc(92px + env(safe-area-inset-bottom,0px));background:rgba(255,140,26,.45)}
#SH{right:88px;bottom:calc(92px + env(safe-area-inset-bottom,0px));background:rgba(56,232,255,.32);font-size:12px}
#EN{right:162px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:rgba(255,196,64,.36);font-size:12px}
#SPBTN{
  position:fixed;right:58px;top:calc(42px + env(safe-area-inset-top,0px));z-index:16;
  height:36px;padding:0 12px;border-radius:18px;background:rgba(16,22,34,.82);
  border:1.5px solid #38e8ff;color:#aef7ff;font:700 11px Georgia,serif;cursor:pointer;
}
#ov{
  position:fixed;inset:0;z-index:60;background:rgba(10,14,22,.93);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;gap:14px;
}
#ov h1{font-size:36px;margin:0;letter-spacing:.02em;color:var(--ac)}
#tx{max-width:520px;width:100%;line-height:1.5;white-space:pre-line;margin:0}
#ov button{
  font:17px Georgia,serif;padding:11px 24px;border-radius:8px;
  border:2px solid var(--ac);background:transparent;color:var(--fg);cursor:pointer;
}
#ov button:first-of-type{background:var(--ac);color:#08131a;font-weight:700}
#rot{
  display:none;position:fixed;inset:0;z-index:99;background:#0d111a;color:#fff2e0;
  align-items:center;justify-content:center;text-align:center;font-size:24px;padding:24px;
}
@media (orientation:portrait){#rot{display:flex}}
/* Title screen */
#ts{
  position:fixed;inset:0;z-index:50;display:none;overflow:hidden;
  background:radial-gradient(circle at 32% 45%,#1d586e 0%,#132638 48%,#0b0f19 100%);
}
#logo{
  position:absolute;left:5vw;top:12vh;pointer-events:none;
}
#logo b{
  display:inline-block;font:900 min(14vh,8.5vw) "Trebuchet MS",Verdana,sans-serif;
  color:#aef7ff;letter-spacing:.02em;
  text-shadow:0 0 22px rgba(56,232,255,.75),0 4px 0 #0a2233;
}
#logo u{
  display:inline-block;text-decoration:none;font-size:.38em;color:#08131a;background:#38e8ff;
  border:2px solid #fff;border-radius:.4em;padding:.08em .38em;margin-left:.3em;
  vertical-align:top;transform:rotate(-6deg);
}
#logo small{
  display:block;margin-top:1vh;font:italic 700 clamp(12px,3vh,19px) Georgia,serif;
  color:#ffe3b8;letter-spacing:.08em;text-shadow:0 2px 6px rgba(0,0,0,.85);
}
#menu{
  position:absolute;right:5vw;top:24%;width:min(34vw,290px);
  display:flex;flex-direction:column;gap:2vh;
}
#menu button{
  height:clamp(38px,10.5vh,56px);border:2px solid #aef7ff;border-radius:999px;color:#fff;
  font:800 clamp(15px,3.6vh,22px) "Trebuchet MS",Verdana,sans-serif;
  background:linear-gradient(180deg,#1b3b52,#0f2030);
  box-shadow:0 5px 0 rgba(0,0,0,.45),0 0 18px rgba(56,232,255,.22);cursor:pointer;
}
#menu button:active{transform:translateY(3px)}
#m1{height:clamp(46px,13vh,66px)!important;background:linear-gradient(180deg,#38e8ff,#1282a8)!important;color:#06131a!important}
.mp{
  display:block;width:100%;margin:6px 0;padding:10px 14px;border-radius:8px;
  border:1px solid rgba(106,240,255,.35);background:rgba(56,232,255,.16);
  color:#fff2e0;font:700 16px Georgia,serif;cursor:pointer;
}
.mp:disabled{opacity:.4;cursor:not-allowed}
</style>
</head>
<body>
<div id="rot">Please rotate your phone to landscape ↻</div>
<div id="flash"></div>
<canvas id="cv"></canvas>
<div id="hud"><span id="h1"></span><span id="h2"></span></div>
<div id="bn"></div>

<input type="file" id="spFile" accept="image/*" style="display:none">
<button id="SPBTN" title="Optional: Load your 4-pose sprite sheet image">Load Sprite</button>

<div class="b" id="L">◀</div>
<div class="b" id="R">▶</div>
<div class="b" id="EN">Enter</div>
<div class="b" id="SH">Shop</div>
<div class="b" id="M">Bolt</div>
<div class="b" id="A">Sword</div>
<div class="b" id="J">Jump</div>

<div id="ts">
 <div id="logo"><b>Snowdigo<u>2D</u></b><small>Seek the Mageblade. Master the Lightning.</small></div>
 <div id="menu">
  <button id="m1">▶ Start</button>
  <button id="m2">✦ Realms</button>
  <button id="m3">✥ Controls</button>
  <button id="m4">★ Story</button>
 </div>
</div>

<div id="ov">
 <h1 id="h">Snowdigo 2D</h1>
 <div id="tx"></div>
 <button id="b1"></button>
 <button id="b2"></button>
</div>

<script>
const $=id=>document.getElementById(id),ov=$('ov'),flEl=$('flash'),cv=$('cv'),ctx=cv.getContext('2d');
const T={l:0,r:0,jh:0,jp:0,ap:0,mp:0,sp:0,ep:0},K={};

addEventListener('keydown',e=>{
 K[e.code]=1;
 if(e.repeat)return;
 if(['Space','ArrowUp','KeyW'].includes(e.code))T.jp=1;
 if(['KeyJ','KeyZ'].includes(e.code))T.ap=1;
 if(['KeyK','KeyX'].includes(e.code))T.mp=1;
 if(['KeyE','KeyC'].includes(e.code))T.sp=1;
 if(['KeyF','Enter'].includes(e.code))T.ep=1;
 if(e.code.startsWith('Arrow')||e.code=='Space')e.preventDefault();
});
addEventListener('keyup',e=>K[e.code]=0);

[['L','l'],['R','r'],['J','jh'],['A','ap'],['M','mp'],['SH','sp'],['EN','ep']].forEach(([id,k])=>{
 const el=$(id),hold=k=='l'||k=='r'||k=='jh';
 el.addEventListener('pointerdown',e=>{e.preventDefault();T[k]=1;if(k=='jh')T.jp=1});
 if(hold)['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,()=>T[k]=0));
});

// Optional custom 2x2 Sprite Sheet loader (removes dark background cleanly)
let spriteSheet=null;
$('SPBTN').onclick=()=>$('spFile').click();
$('spFile').onchange=e=>{
 const file=e.target.files[0];if(!file)return;
 const img=new Image();
 img.onload=()=>{
  const off=document.createElement('canvas');off.width=img.width;off.height=img.height;
  const oc=off.getContext('2d');oc.drawImage(img,0,0);
  const idata=oc.getImageData(0,0,off.width,off.height),d=idata.data;
  const bgR=d[0],bgG=d[1],bgB=d[2];
  for(let i=0;i<d.length;i+=4){
   const dist=Math.hypot(d[i]-bgR,d[i+1]-bgG,d[i+2]-bgB);
   if(dist<36)d[i+3]=0;
   else if(dist<55)d[i+3]=Math.floor(((dist-36)/19)*255);
  }
  oc.putImageData(idata,0,0);
  spriteSheet=off;
  banner('Custom 2D Anime Sprite Sheet Loaded!');
 };
 img.src=URL.createObjectURL(file);
};

let AC,mute=0;
function sfx(f,d=.1,ty='square',v=.045,f2){
 if(mute)return;
 try{
  AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  if(AC.state=='suspended')AC.resume();
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=ty;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);
 }catch(e){}
}
function triggerFlash(strength=.55){
 shk=Math.max(shk,.22);
 flEl.style.opacity=strength;
 clearTimeout(triggerFlash.t);
 triggerFlash.t=setTimeout(()=>flEl.style.opacity=0,95);
}

let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function rs(){
 W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
 cv.width=W*DPR;cv.height=H*DPR;
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',rs);rs();

let sd=1;
const rn=()=>(sd=sd*16807%2147483647)/2147483647;

// ---------- 5 Swordigo Realms (2D Painterly Palette) ----------
const Z=[
{n:'Cairnwood & Forest',m:'Collect 3 Mageblade Shards, clear cottage guards, & defeat Corruptor.',w:'Shards',k:3,e:4,sky:['#133447','#276b78','#62a69c'],mt:['#173a4a','#102936'],c:'#4c3626',cap:'#3b8c52',ec:'#397a49',sc:'#38e8ff',f0:196,g:30,village:1,boss:{n:'Corruptor',hp:8,c:'#2f6327',c2:'#ffbe2e'}},
{n:'Frost Peaks & Caves',m:'Collect 3 Frost Shards on icy ledges & defeat the Overseer.',w:'Shards',k:3,e:5,sky:['#0b1f3d','#255c8a','#88c4eb'],mt:['#386894','#24486b'],c:'#5b7b9e',cap:'#e3f6ff',ec:'#2b78b5',sc:'#6af0ff',f0:174,g:30,ice:1,boss:{n:'Overseer',hp:10,c:'#3f8ec9',c2:'#ffffff'}},
{n:'Evernight & Flame Depths',m:'Gather 4 Ember Shards & defeat the Flame King.',w:'Shards',k:4,e:6,sky:['#140b1f','#3b1936','#8f3329'],mt:['#291226','#1a0b19'],c:'#382319',cap:'#6e2d25',ec:'#9e2d48',sc:'#ff9224',f0:147,g:30,maw:1,boss:{n:'Flame King',hp:12,c:'#381c36',c2:'#ff8c1a'}},
{n:'Wastelands & Dwarven Hall',m:'Recover 4 Relic Shards & defeat the Dwarven King.',w:'Shards',k:4,e:6,sky:['#6e391b','#b86d2c','#f2c572'],mt:['#8c5227','#633819'],c:'#7d5629',cap:'#c99742',ec:'#9c6c1e',sc:'#4affd0',f0:165,g:30,sp:1,boss:{n:'Dwarven King',hp:14,c:'#9e7429',c2:'#38e8ff'}},
{n:"World's End Keep",m:'Collect 5 Final Shards & defeat Master of Chaos!',w:'Shards',k:5,e:7,sky:['#071726','#113e52','#1f6e78'],mt:['#0f3547','#09212e'],c:'#1e3247',cap:'#369c8a',ec:'#c9427c',sc:'#38e8ff',f0:131,g:16,fl:1,boss:{n:'Master of Chaos',hp:24,c:'#183c66',c2:'#ff5ea8'}}
];

let pl,en,sh,pj,fx,hz,hr,ch,AR,boss,portal,shopSpot,doors,inside,roomEnemy,roomChest,props,ambient;
let Z0=0,col=0,coins=120,xp=0,lvl=1,trinket='None',open=0,bd=0,st='menu',inv=0,cx=0,cy=0,tt=0,mx=0,shk=0,mn=0;
try{
 mx=+localStorage.getItem('sd3b')||0;
 coins=+localStorage.getItem('sd3c')||120;
 xp=+localStorage.getItem('sd3x')||0;
 lvl=+localStorage.getItem('sd3l')||1;
}catch(e){}

const p={x:0,y:0,vx:0,vy:0,hp:5,mhp:5,atkDmg:1,magDmg:2,f:1,g:0,j:0,atk:0,cs:0,cc:0,mc:0,sx:0,coy:0,jb:0,sq:0,gy:0,spd:7.2};

function burst(x,y,c,n){
 for(let i=0;i<n;i++){
  fx.push({x,y,vx:(Math.random()-.5)*7.5,vy:Math.random()*6.5+1.5,l:.5,ml:.5,c,sz:2.5+Math.random()*3});
 }
}
function ball(x,y,vx,vy,own,c){
 pj.push({x,y,vx,vy,own,life:2.3,c});
}
function banner(t){
 const b=$('bn');b.textContent=t;b.style.opacity=1;
 clearTimeout(banner.t);banner.t=setTimeout(()=>b.style.opacity=0,3400);
}
function saveProg(){
 try{
  localStorage.setItem('sd3b',Math.min(mx,5));
  localStorage.setItem('sd3c',coins);
  localStorage.setItem('sd3x',xp);
  localStorage.setItem('sd3l',lvl);
 }catch(e){}
}
function gainXp(amt){
 xp+=amt;
 const need=lvl*40;
 if(xp>=need){
  xp-=need;lvl++;saveProg();
  st='pause';
  ovl('Level Up! (Lv '+lvl+')','Choose an attribute to upgrade:',
   '+1 Max HP & Full Heal',()=>{p.mhp++;p.hp=p.mhp;st='play';banner('Health Upgraded!')},
   '+1 Sword/Magic Power',()=>{p.atkDmg++;p.magDmg++;st='play';banner('Attack & Magic Upgraded!')});
 }else saveProg();
}

function load(z){
 Z0=z;const q=Z[z];sd=z*77+5;
 inside=0;roomEnemy=null;roomChest=null;
 pl=[];en=[];sh=[];pj=[];fx=[];hz=[];hr=[];ch=[];doors=[];shopSpot=null;props=[];ambient=[];
 col=0;open=0;bd=0;boss=null;inv=0;
 Object.assign(p,{x:0,y:0,vx:0,vy:0,hp:p.mhp,f:1,g:0,j:0,atk:0,cs:0,cc:0,mc:0,sx:0,coy:0,jb:0,sq:0,gy:0});
 cx=0;cy=1.5;

 const gs=[],Lm=46+z*6;let x=-6;
 while(x<Lm){
  const w=gs.length==0?14:5+Math.floor(rn()*6),g={a:x,b:x+w,fp:0};
  gs.push(g);pl.push({a:g.a,b:g.b,y:0});
  for(let c=g.a+w/2;c<g.b-3&&w>6;c+=9){
   const y=2.5+rn()*1.2;pl.push({a:c-1.5,b:c+1.5,y});g.fp=y;g.fx=c;
  }
  x+=w+2+rn()*1.1;
 }
 AR={a:x,b:x+26};pl.push({a:AR.a,b:AR.b,y:0});
 const n=gs.length;

 if(q.village){
  doors.push({x:1.5,y:0,roomIdx:0});
  shopSpot={x:7.8,y:0};
 }

 gs.concat([AR]).forEach(g=>{
  for(let i=0,c=2+Math.floor(rn()*2);i<c;i++){
   props.push({x:g.a+1+rn()*(g.b-g.a-2),s:.85+rn()*.65,k:Math.floor(rn()*3)});
  }
 });

 for(let i=0;i<q.k;i++){
  const g=gs[Math.min(n-1,1+Math.floor((i+.5)*(n-1)/q.k))];
  const onf=i%2&&g.fp,sx=onf?g.fx:(g.a+g.b)/2,sy=onf?g.fp+1.1:1.1;
  sh.push({x:sx,y:sy});
 }

 [2,n-2].forEach(i=>{
  const g=gs[Math.min(n-1,i)],hx=(g.a+g.b)/2+1.8;
  hr.push({x:hx,y:1.05});
 });

 if(n>2)ch.push({x:(gs[1].a+gs[1].b)/2,y:0,open:0});
 if(n>4)ch.push({x:(gs[n-2].a+gs[n-2].b)/2,y:0,open:0});

 for(let i=0;i<q.e;i++){
  const g=gs[1+(i%(n-1))],t=z==0?0:[1,0,2][i%3];
  const ex=g.a+1.5+rn()*(g.b-g.a-3),by=t==1?2.5+rn()*1.1:.55;
  en.push({x:ex,ox:ex,y:by,by,t,hp:(t==2?2:1+(Z0>2?1:0))+Math.floor((lvl-1)*.5),x0:g.a+.6,x1:g.b-.6,d:1,r:.55,h:.55,a:rn()*6,fl:0});
 }

 if(q.sp||q.maw)for(let i=2;i<n;i++)if(rn()<.75){
  const g=gs[i];hz.push({x:g.a+1.5+rn()*(g.b-g.a-3)});
 }

 boss={x:AR.b-8,y:1.3,hp:q.boss.hp,mh:q.boss.hp,r:1.3,h:1.6,cd:2,t:'b',a:0,on:0,fl:0};
 en.push(boss);
 portal={x:AR.b-3,y:1.5};

 for(let i=0;i<75;i++){
  ambient.push({x:Math.random()*60-30,y:Math.random()*16-2,vx:1.2+Math.random()*2.2,vy:(Math.random()-.5)*.6,sz:1.5+Math.random()*2.5,c:i%3==0?'#38e8ff':'#ffbe55'});
 }
}

function enterRoom(){
 inside=1;pj=[];fx=[];
 roomChest={x:5.5,y:0,opened:0,unlocked:0};
 roomEnemy={x:1.8,y:.6,hp:3+Z0,r:.6,h:.6,d:-1,x0:-2.5,x1:4.2,a:0,fl:0,alive:1};
 p.x=-4.5;p.y=0;p.vx=0;p.vy=0;p.sx=-4.5;
 banner('Inside Cottage! Defeat the guard to unlock the Reward Chest.\nPress Enter at the left door to exit.');
}
function exitRoom(){
 inside=0;pj=[];fx=[];
 const d=doors[0]||{x:1.5,y:0};
 p.x=d.x;p.y=0;p.vx=0;p.vy=0;p.sx=d.x;
 banner('Returned to '+Z[Z0].n);
}
function tryEnter(){
 if(inside){
  if(p.x<-3.8){exitRoom();return}
  if(roomChest&&roomChest.unlocked&&!roomChest.opened&&Math.abs(p.x-roomChest.x)<1.8){
   roomChest.opened=1;coins+=60;p.hp=Math.min(p.mhp,p.hp+2);gainXp(25);
   burst(roomChest.x,1.0,'#ffd23a',22);triggerFlash(.45);sfx(880,.25,'triangle',.07,1320);
   banner('Reward Chest Opened! +60 Soul Shards, +2 HP & +25 XP');
  }else if(roomChest&&!roomChest.unlocked){
   banner('Defeat the guard first to unlock the chest!');
  }else banner('Walk to the left door to exit.');
  return;
 }
 const nearDoor=doors.find(d=>Math.abs(p.x-d.x)<2.4);
 if(nearDoor)enterRoom();
 else banner('Walk near the Cottage door and press Enter.');
}
function openShop(){
 if(inside){banner('Exit the room to visit the Shop.');return}
 if(!shopSpot||Math.abs(p.x-shopSpot.x)>3.4){banner('Walk near the SHOP cottage to buy items.');return}
 st='pause';
 ovl('Elder Shop & Trinkets','Soul Shards: '+coins+' | Trinket: '+trinket,
  'Heal +2 HP (30)',()=>{coins=Math.max(0,coins-30);p.hp=Math.min(p.mhp,p.hp+2);saveProg();st='play';banner('Restored +2 Health!')},
  'Lightning/Fire Trinket (60)',()=>{coins=Math.max(0,coins-60);trinket='Lightning';saveProg();st='play';banner('Equipped Lightning/Fire Trinket!')});
}

function go(z){load(z);st='play';banner('Realm '+(z+1)+': '+Z[z].n+'\n'+Z[z].m)}
function chk(){
 if(!open&&col>=Z[Z0].k&&bd){
  open=1;banner('Portal Gate open! Step inside.');sfx(660,.4,'triangle',.06,990);
 }
}
function hurt(f){
 if(inv>0||st!='play')return;
 p.hp--;inv=1.3;p.vy=8;p.vx=f*7;shk=.32;sfx(160,.25,'sawtooth',.07,60);
 if(p.hp<=0)over();
}
function hit(e,d,f){
 const totalDmg=d*p.atkDmg;
 e.hp-=totalDmg;e.fl=.16;e.x+=f*(e.t=='b'?.15:.65);shk=Math.max(shk,.15);
 sfx(240,.08,'sawtooth',.05);
 burst(e.x,e.y,trinket!='None'?'#ff8c24':'#38e8ff',8);
 if(e.hp<=0){
  en.splice(en.indexOf(e),1);coins+=15;gainXp(18);
  burst(e.x,e.y,'#ffe14a',18);sfx(120,.3,'square',.06,40);
  if(e===boss){bd=1;shk=.65;chk()}
 }
}
function lockL(){
 try{
  const fs=document.documentElement.requestFullscreen?document.documentElement.requestFullscreen():Promise.resolve();

 }

 }
 // Realm landmarks and richly layered silhouettes
 if(kind==='forest'){

   ctx.strokeStyle='#754f36';ctx.lineWidth=5*sc;ctx.beginPath();ctx.moveTo(x,y-30*sc);ctx.lineTo(x-22*sc,y-70*sc);ctx.moveTo(x,y-45*sc);ctx.lineTo(x+25*sc,y-82*sc);ctx.stroke();
   for(let j=0;j<7;j++){let a=j*Math.PI*2/7;ctx.fillStyle=['#2f7650','#39895a','#4b9d61','#286c4b'][j%4];ctx.beginPath();ctx.ellipse(x+Math.cos(a)*25*sc,y-112*sc+Math.sin(a)*17*sc,29*sc,24*sc,a*.15,0,Math.PI*2);ctx.fill();}
   ctx.fillStyle='rgba(184,232,133,.18)';ctx.beginPath();ctx.arc(x-12*sc,y-126*sc,15*sc,0,Math.PI*2);ctx.fill();
  }
 }else if(kind==='ice'){

function draw(){
 const q=Z[Z0],sp=Math.min(1,Math.abs(p.vx)/p.spd),air=!p.g,ph=tt*(8+sp*5);
 shk=Math.max(0,shk-0.016);
 const kx=(Math.random()-.5)*shk*28,ky=(Math.random()-.5)*shk*28;

 const targetX=inside?p.x*.25:p.x+p.f*1.8;
 const targetY=inside?1.6:Math.max(p.y,0)*.82+2.1;
 const followX=1-Math.pow(.0008,1/60),followY=1-Math.pow(.0018,1/60);
 cx+=(targetX-cx)*followX;
 cy+=(targetY-cy)*followY;

 const ppm=Math.min(W,H)*0.115; // pixels per world meter
 const toSX=wx=>W*0.5+(wx-cx)*ppm+kx;
 const toSY=wy=>H*0.76-(wy-cy+1.6)*ppm+ky;

 // Sky Gradient
 const sg=ctx.createLinearGradient(0,0,0,H);
 if(inside){
  sg.addColorStop(0,'#120e1a');sg.addColorStop(1,'#241b2e');
 }else{
  sg.addColorStop(0,q.sky[0]);sg.addColorStop(.55,q.sky[1]);sg.addColorStop(1,q.sky[2]);
 }
 ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);

 if(inside){
  // Cottage Interior Room
  const rx0=toSX(-8),rx1=toSX(8),ryTop=toSY(5.5),ryFloor=toSY(0);
  ctx.fillStyle='#1d1526';ctx.fillRect(rx0,ryTop,rx1-rx0,ryFloor-ryTop);
  ctx.strokeStyle='#433252';ctx.lineWidth=4;ctx.strokeRect(rx0,ryTop,rx1-rx0,ryFloor-ryTop);

  // Wall torches
  [-3.8,3.8].forEach(tx=>{
   const sx=toSX(tx),sy=toSY(2.8);
   ctx.fillStyle='#5c3a21';ctx.fillRect(sx-4,sy,8,28);
   const g=ctx.createRadialGradient(sx,sy-4,2,sx,sy-4,48);
   g.addColorStop(0,'rgba(255,210,90,0.85)');g.addColorStop(1,'rgba(255,120,20,0)');
   ctx.fillStyle=g;ctx.beginPath();ctx.arc(sx,sy-4,48,0,Math.PI*2);ctx.fill();
  });

  // Exit Door on left
  const dx=toSX(-5.5),dy=toSY(0);
  ctx.fillStyle='#5e3418';ctx.strokeStyle='#241206';ctx.lineWidth=3;
  ctx.fillRect(dx-24,dy-74,48,74);ctx.strokeRect(dx-24,dy-74,48,74);

  // Reward Chest on right
  if(roomChest){
   const chx=toSX(roomChest.x),chy=toSY(0);
   ctx.fillStyle=roomChest.opened?'#8c5828':'#6e3a16';ctx.strokeStyle='#1c0e04';ctx.lineWidth=2.5;
   ctx.fillRect(chx-24,chy-32,48,32);ctx.strokeRect(chx-24,chy-32,48,32);
   ctx.fillStyle=roomChest.unlocked?'#ffd23a':'#ff3b5c';
   ctx.beginPath();ctx.arc(chx,chy-18,6,0,Math.PI*2);ctx.fill();
  }

  // Floor
  ctx.fillStyle='#4a3322';ctx.fillRect(rx0,ryFloor,rx1-rx0,H-ryFloor);
  ctx.fillStyle='#78553a';ctx.fillRect(rx0,ryFloor,rx1-rx0,8);

  // Room Guard Enemy
  if(roomEnemy&&roomEnemy.alive){
   const ex=toSX(roomEnemy.x),ey=toSY(roomEnemy.y);
   ctx.fillStyle=roomEnemy.fl>0?'#ffffff':'#9e2b4c';ctx.strokeStyle='#14080e';ctx.lineWidth=2.5;
   ctx.beginPath();ctx.arc(ex,ey,24,0,Math.PI*2);ctx.fill();ctx.stroke();
   ctx.fillStyle='#ffd23a';ctx.fillRect(ex-10,ey-6,6,6);ctx.fillRect(ex+4,ey-6,6,6);
  }
 }else{
  // High-resolution procedural scenery: sharp at any screen size, with camera parallax.
  drawRealmBackground(ppm);

   const dx=toSX(shopSpot.x),dy=toSY(0);

  }

  // Chests
  for(const c of ch){
   const sx=toSX(c.x),sy=toSY(c.y);

  }

  // Mageblade Shards
  for(const s of sh){
   const sx=toSX(s.x),sy=toSY(s.y+Math.sin(tt*3+s.x)*.14);
   ctx.save();ctx.translate(sx,sy);ctx.shadowColor=q.sc;ctx.shadowBlur=16;
   ctx.fillStyle=q.sc;ctx.beginPath();
   ctx.moveTo(0,-18);ctx.lineTo(12,0);ctx.lineTo(0,18);ctx.lineTo(-12,0);ctx.closePath();ctx.fill();
   ctx.restore();
  }

  // Hearts
  for(const h of hr){
   const sx=toSX(h.x),sy=toSY(h.y+Math.sin(tt*3+h.x)*.1);
   ctx.fillStyle='#ff4a6a';ctx.beginPath();ctx.arc(sx,sy,10,0,Math.PI*2);ctx.fill();
  }

  // Portal
  const px=toSX(portal.x),py=toSY(portal.y);
  ctx.save();ctx.translate(px,py);
  ctx.strokeStyle=open?'#38e8ff':'#5c667a';ctx.lineWidth=6;

  // Enemies & Boss

   }else{

 }

 // Projectiles

  drawAnimeHero(toSX(p.x),toSY(p.y),ppm*1.12,p.f,pose,ph,atkProg);

 $('h1').textContent='\u2764'.repeat(Math.max(0,p.hp))+'  Lv.'+lvl+'  |  \uD83E\uDE99 '+coins;

  ?(roomChest?.opened?'Chest Opened! Exit left':roomChest?.unlocked?'Unlock Chest (Enter)!':'Defeat Guard!')
  :(open?'Go to the portal \u25BA':q.w+' '+col+'/'+q.k+(boss&&!bd?'  |  '+q.boss.n+' '+boss.hp+'/'+boss.mh:''));
}

let last=performance.now();

 const dt=Math.min(.033,(n-last)/1000);last=n;tt+=dt;
 if(st=='play'&&innerWidth>innerHeight)upd(dt);

}

setInterval(()=>{

},380);
