<style>
:root{--bg:#120d18;--fg:#fff6e8;--ac:#ff9424;--bt:rgba(18,14,28,.55)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;font-family:Georgia,"Times New Roman",serif;color:var(--fg);user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
#flash{position:fixed;inset:0;z-index:25;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(120,248,255,.78) 0%,rgba(255,148,36,.42) 55%,rgba(255,255,255,0) 100%);transition:opacity .08s ease-out}
#hud{position:fixed;top:0;left:0;right:0;z-index:10;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 0;display:flex;justify-content:space-between;align-items:center;font-size:15px;pointer-events:none;text-shadow:0 2px 6px rgba(0,0,0,.9)}
#hud span{background:rgba(14,10,22,.48);padding:5px 10px;border-radius:10px;border:1px solid rgba(255,246,232,.18)}
#bn{position:fixed;top:17%;left:0;right:0;z-index:12;text-align:center;font-size:20px;white-space:pre-line;opacity:0;transition:opacity .5s;pointer-events:none;text-shadow:0 3px 10px rgba(0,0,0,.95)}
.b{position:fixed;z-index:15;width:64px;height:64px;border-radius:20px;background:var(--bt);border:2px solid rgba(255,246,232,.5);color:var(--fg);font:700 14px Georgia,serif;display:flex;align-items:center;justify-content:center;touch-action:none;box-shadow:0 6px 16px rgba(0,0,0,.45)}
.b:active{transform:scale(.93);background:rgba(255,246,232,.34)}
#L{left:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#R{left:90px;bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#J{right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#A{right:90px;bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#M{right:14px;bottom:calc(94px + env(safe-area-inset-bottom,0px));background:rgba(255,140,26,.42)}
#SH{right:90px;bottom:calc(94px + env(safe-area-inset-bottom,0px));background:rgba(70,185,255,.36);font-size:12px}
#ov{position:fixed;inset:0;z-index:60;background:rgba(14,10,22,.92);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px}
#ov h1{font-size:40px;margin:0;letter-spacing:.02em;color:var(--ac)}
#tx{max-width:480px;width:100%;line-height:1.5;white-space:pre-line;margin:0}
#ov button{font:18px Georgia,serif;padding:12px 26px;border-radius:8px;border:2px solid var(--ac);background:transparent;color:var(--fg);cursor:pointer}
#ov button:first-of-type{background:var(--ac);color:#1a1006}
#rot{display:none;position:fixed;inset:0;z-index:99;background:#120d18;color:#fff2e0;align-items:center;justify-content:center;text-align:center;font-size:24px;padding:24px}
@media (orientation:portrait){#rot{display:flex}}
/* Title screen */
#ts{position:fixed;inset:0;z-index:50;display:none;overflow:hidden;background:linear-gradient(#1b0b3a 0%,#4b1d7a 32%,#c2459a 62%,#ff9a6b 84%,#ffd08a 100%)}
#ts svg{position:absolute;inset:0;width:100%;height:100%}
.st{position:absolute;border-radius:50%;background:#fff6c8;box-shadow:0 0 6px #ffe9a0;animation:tw 3s ease-in-out infinite;pointer-events:none}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.fl{animation:bob 4s ease-in-out infinite}.fl2{animation:bob 5s ease-in-out infinite reverse}
.sw{transform-box:fill-box;transform-origin:100% 50%;animation:sway 1.4s ease-in-out infinite}
.glow{animation:pulse 1.4s ease-in-out infinite}
.cl{animation:drift 9s ease-in-out infinite alternate}
#logo{position:absolute;left:0;right:0;top:3vh;text-align:center;pointer-events:none;animation:bob 3.5s ease-in-out infinite}
#logo b{display:inline-block;font:900 min(16vh,9.5vw) "Trebuchet MS","Arial Rounded MT Bold",Verdana,sans-serif;color:#ffe14a;letter-spacing:.01em;text-shadow:-2px -2px 0 #4a1a7a,2px -2px 0 #4a1a7a,-2px 2px 0 #4a1a7a,2px 2px 0 #4a1a7a,0 .06em 0 #e8821a,0 .12em 0 #4a1a7a,0 .2em .25em rgba(0,0,0,.4)}
#logo u{display:inline-block;text-decoration:none;font-size:.42em;color:#fff;background:#ff3f7f;border:3px solid #fff;border-radius:.4em;padding:.05em .35em;margin-left:.3em;vertical-align:top;transform:rotate(-7deg);text-shadow:none;box-shadow:0 4px 0 #a01a52}
#logo small{display:block;margin-top:.5vh;font:italic 700 clamp(11px,3vh,18px) Georgia,serif;color:#fff;letter-spacing:.12em;text-shadow:0 2px 6px rgba(0,0,0,.7)}
#menu{position:absolute;right:4vw;top:35%;width:min(34vw,290px);display:flex;flex-direction:column;gap:2vh}
#menu button{height:clamp(36px,10.5vh,56px);border:3px solid #fff;border-radius:999px;color:#fff;font:800 clamp(15px,3.8vh,24px) "Trebuchet MS",Verdana,sans-serif;text-shadow:0 2px 0 rgba(0,0,0,.3);box-shadow:0 5px 0 rgba(0,0,0,.35),0 0 18px rgba(255,255,255,.25);cursor:pointer}
#menu button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
#m1{height:clamp(44px,13vh,66px)!important;background:linear-gradient(#7dff8a,#1fb85a);animation:beat 1.3s ease-in-out infinite}
#m2{background:linear-gradient(#ffb3d9,#ff4f9a)}#m3{background:linear-gradient(#8fdcff,#2f8fff)}#m4{background:linear-gradient(#d9b3ff,#8a4fff)}
#m1::before{content:"\25B6  "}#m2::before{content:"\2726  "}#m3::before{content:"\2725  "}#m4::before{content:"\2605  "}
.mp{display:block;width:100%;margin:6px 0;padding:10px 14px;border-radius:8px;border:1px solid rgba(255,242,224,.35);background:rgba(255,140,26,.22);color:#fff2e0;font:700 16px Georgia,serif;cursor:pointer}
.mp:disabled{opacity:.4;cursor:not-allowed}
</style>
</head>

<script>
const $=id=>document.getElementById(id),ov=$('ov'),flEl=$('flash');
const T={l:0,r:0,jh:0,jp:0,ap:0,mp:0,sp:0},K={};

addEventListener('keyup',e=>K[e.code]=0);
[['L','l'],['R','r'],['J','jh'],['A','ap'],['M','mp'],['SH','sp']].forEach(([id,k])=>{
 const el=$(id),hold=k=='l'||k=='r'||k=='jh';
 el.addEventListener('pointerdown',e=>{e.preventDefault();T[k]=1;if(k=='jh')T.jp=1});
 if(hold)['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,()=>T[k]=0));
});
let AC,mute=0;

function triggerFlash(strength=.65){shk=Math.max(shk,.25);flEl.style.opacity=strength;clearTimeout(triggerFlash.t);triggerFlash.t=setTimeout(()=>flEl.style.opacity=0,95)}

const R=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
R.setPixelRatio(Math.min(devicePixelRatio,2));
R.shadowMap.enabled=true;
R.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(R.domElement);

const HL=new THREE.HemisphereLight(0xf8faff,0x2e223d,1.1);

DL.position.set(10,18,14);DL.castShadow=true;
DL.shadow.mapSize.set(1024,1024);
S.add(HL,DL);
function rs(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}addEventListener('resize',rs);rs();
const mat=(c,e)=>new THREE.MeshStandardMaterial({color:c,emissive:e||0,emissiveIntensity:e?.35:0,roughness:.55,metalness:.12});

const bas=(c,o)=>new THREE.MeshBasicMaterial({color:c,transparent:o!=null,opacity:o==null?1:o});
let sd=1;const rn=()=>(sd=sd*16807%2147483647)/2147483647;

// ---------- Hero (Veer) ----------
const P=new THREE.Group();S.add(P);const BD=new THREE.Group();P.add(BD);
const pv=(x,y,par)=>{const g=new THREE.Group();g.position.set(x,y,0);par.add(g);return g};
const legL=pv(-.17,.95,BD),legR=pv(.17,.95,BD),armL=pv(-.46,1.6,BD),armR=pv(.46,1.6,BD);
[legL,legR].forEach(l=>{box(.24,.6,.28,0x6e4022,0,-.3,0,l,1);box(.28,.2,.38,0x2e180e,0,-.62,.05,l,1)});
box(.74,.74,.46,0x197a42,0,1.3,0,BD,1);box(.76,.13,.48,0xfff2d8,0,1.0,0,BD);box(.3,.3,.12,0xd9ad26,0,1.35,.25,BD);
box(.52,.52,.52,0xf2c291,0,1.95,0,BD,1);box(.6,.22,.6,0x181222,0,2.22,0,BD);
[-.14,.14].forEach(x=>{box(.1,.1,.06,0x181222,x,1.97,.27,BD);box(.04,.04,.07,0xfff6d0,x+.02,1.99,.28,BD)});
for(let i=-1;i<2;i++){const c=new THREE.Mesh(new THREE.ConeGeometry(.11,.34,5),mat(0x181222));c.position.set(i*.17,2.47,0);BD.add(c)}
[armL,armR].forEach(a=>{box(.21,.58,.23,0x197a42,0,-.28,0,a,1);box(.21,.15,.23,0xf2c291,0,-.62,0,a)});
box(.32,.15,.32,0xe0a838,.5,1.78,0,BD);
const swd=pv(0,-.66,armR);swd.rotation.z=-1.2;
box(.11,1.22,.06,0xeaf9ff,0,.72,0,swd);
const aura=new THREE.Mesh(new THREE.BoxGeometry(.22,1.26,.12),bas(0x5ce8ff,.42));aura.position.set(0,.72,0);swd.add(aura);
box(.4,.1,.15,0xffb824,0,.1,0,swd);box(.09,.28,.09,0x5c3014,0,-.08,0,swd);
const sc=[];let s0=pv(-.3,1.72,BD);for(let i=0;i<4;i++){box(.35,.16,.11,0xff8c1a,-.17,0,0,s0);const n=pv(-.34,0,s0);sc.push(s0);s0=n}
const BL=new THREE.Mesh(new THREE.CircleGeometry(.58,18),bas(0x09060e,.38));BL.rotation.x=-Math.PI/2;S.add(BL);
const SL=new THREE.Mesh(new THREE.RingGeometry(.95,1.8,24,1,-.95,1.9),new THREE.MeshBasicMaterial({color:0x9ef6ff,transparent:true,opacity:0,side:2}));S.add(SL);

// ---------- Realms ----------
const Z=[
{n:'Cairnwood Outskirts',m:'Collect 3 Sunstones, visit the Cabin Shop, and defeat Mossback.',w:'Sunstones',k:3,e:4,sky:['#2b6cb0','#cdeaff'],fog:0xb8dcfa,sun:0xfff4b8,c:0x6e4b2d,cap:0x3fa845,bc:[0x7ba9cf,0x5c966c,0x3c7a4c],bs:0,ec:0x3aa64d,es:0,sc:0xffd23a,pc:0xffffff,pv:[.7,-.4],f0:196,g:30,cl:1,pit:0x23628f,village:1,boss:{n:'Mossback',hp:8,c:0x3f7a32,c2:0xffcc33}},
{n:'Frost Peaks',m:'Find 3 Ice Shards. Watch the slick stone ledges!',w:'Ice Shards',k:3,e:5,sky:['#0f2552','#a8d6ff'],fog:0x9ecbf5,sun:0xffffff,c:0x82a4c9,cap:0xeef9ff,bc:[0x6c8cb0,0x8cb0d6,0xb6d6f2],bs:1,ec:0x4796d1,es:1,sc:0x5af0ff,pc:0xffffff,pv:[-.9,-2.2],f0:174,g:30,ice:1,pit:0x133961,boss:{n:'Frost Wyrm',hp:10,c:0x5eb4f0,c2:0xffffff}},
{n:'Evernight Hollow',m:'Gather 4 Ember Cores through dark woods & Maw plants.',w:'Ember Cores',k:4,e:6,sky:['#120c1e','#463157'],fog:0x22172c,sun:0xc8b4ff,c:0x4a311d,cap:0x2d6628,bc:[0x2d2038,0x22182b,0x181020],bs:2,ec:0xa63b5c,es:2,sc:0xff8c1a,pc:0xc9b8ff,pv:[.25,-.8],f0:147,g:30,maw:1,pit:0x120b1b,boss:{n:'Hollow Warden',hp:12,c:0x3d2847,c2:0xff8c1a}},
{n:'Sunbaked Dunes',m:'Recover 4 Relic Seals. Avoid thorn clusters!',w:'Relic Seals',k:4,e:6,sky:['#d98236','#ffe29e'],fog:0xecc682,sun:0xfff0c0,c:0xa3763b,cap:0xdcb05c,bc:[0xd49b57,0xc28540,0xa86c2e],bs:3,ec:0xb8862c,es:2,sc:0x4affd0,pc:0xf0d090,pv:[3.2,-.2],f0:165,g:30,sp:1,pit:0xb58d3e,boss:{n:'Dune Sovereign',hp:14,c:0xc99c3c,c2:0x2a7aff}},
{n:'Tidewater Trench',m:'Find 5 Ocean Pearls. Float & strike the Trench Titan!',w:'Ocean Pearls',k:5,e:7,sky:['#031838','#126e8f'],fog:0x0b4866,sun:0xbff6ff,c:0x213d59,cap:0x38b29c,bc:[0x105173,0x176e8a,0x208a88],bs:4,ec:0xf25ca2,es:1,sc:0xffffff,pc:0xbff6ff,pv:[.1,1.3],f0:131,g:15,fl:1,ray:1,pit:0x031821,boss:{n:'Tide Titan',hp:24,c:0x215894,c2:0xff6ab0}}];

let W,pl,en,sh,pj,fx,hz,hr,ch,sw,LY,AR,PT,boss,portal,shopSpot,Z0=0,col=0,coins=120,open=0,bd=0,st='menu',inv=0,cx=0,cy=0,cz=12,tt=0,mx=0,shk=0,mn=0;
try{mx=+localStorage.getItem('sd3b')||0;coins=+localStorage.getItem('sd3c')||120}catch(e){}
const p={x:0,y:0,vx:0,vy:0,hp:5,mhp:5,f:1,g:0,j:0,atk:0,cs:0,cc:0,mc:0,sx:0,coy:0,jb:0,sq:0,gy:0,spd:6.4};
const gS=new THREE.SphereGeometry(.32,12,10),fG=new THREE.BoxGeometry(.15,.15,.15),FM={};
const fm=c=>FM[c]||(FM[c]=new THREE.MeshBasicMaterial({color:c}));
function burst(x,y,c,n){for(let i=0;i<n;i++){const m=new THREE.Mesh(fG,fm(c));m.position.set(x,y,0);W.add(m);fx.push({m,vx:(Math.random()-.5)*7.5,vy:Math.random()*6.5+1.2,vz:(Math.random()-.5)*3.2,l:.55})}}
function ball(x,y,vx,vy,own,c){const m=new THREE.Mesh(gS,bas(c));if(own)m.scale.setScalar(1.35);W.add(m);pj.push({x,y,vx,vy,own,life:2.3,m})}
function banner(t){const b=$('bn');b.textContent=t;b.style.opacity=1;clearTimeout(banner.t);banner.t=setTimeout(()=>b.style.opacity=0,3400)}
